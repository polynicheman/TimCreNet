    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ${p.is_following?'is-following':'btn-primary'}" data-action="follow" data-id="${esc(p.id)}" type="button" id="profileFollowBtn">
        ${p.is_following ? 'Following' : 'Follow'}
      </button>
    </div>`;

  return `
    <div class="profile-hero">
      ${avatarHTML(p.avatar_seed || p.handle, p.initials, 'lg')}
      <div class="info">
        <h2>${esc(p.display_name)}</h2>
        <div class="handle">@${esc(p.handle)}</div>
        <div class="meta">
          <span>${esc([p.city,p.region].filter(Boolean).join(', ')||'Location hidden')}</span>
          ${p.country?`<span class="sep"></span><span>${esc(p.country)}</span>`:''}
        </div>
        ${followState}
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat"><b>${Number(p.reliability??5).toFixed(1)}</b><span>Reliability</span></div>
      <div class="stat"><b>${p.collab_count??0}</b><span>Collabs</span></div>
      <div class="stat"><b>${p.follower_count??0}</b><span>Followers</span></div>
      <div class="stat"><b>${p.following_count??0}</b><span>Following</span></div>
      <div class="stat"><b>${p.post_count??0}</b><span>Posts</span></div>
    </div>

    <div class="detail-block">
      <h3>Recent posts</h3>
      <div id="profilePostsHolder" class="feed"><div class="empty" style="padding:24px"><p>Loading posts…</p></div></div>
    </div>

    <div class="detail-block"><h3>Niches</h3><div class="tag-row">${niches}</div></div>
    <div class="detail-block"><h3>Needs a hand with</h3><div class="tag-row">${needs}</div></div>
    <div class="detail-block"><h3>Brings to the table</h3><div class="tag-row">${gives}</div></div>
    <div class="detail-block"><h3>Equipment</h3>${gear}</div>
    <div class="detail-block"><h3>Spaces</h3>${spaces}</div>
    <div class="detail-block"><h3>Availability</h3><div class="tag-row">${avail}</div></div>
    ${isSelf ? `
    <div style="display:flex;gap:10px;margin-top:26px;flex-wrap:wrap">
      <button class="btn" onclick="location.href='onboarding.html'" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Re-run onboarding
      </button>
      <button class="btn" onclick="location.href='account.html'" type="button">
        Account settings →
      </button>
    </div>` : ''}`;
}

/* ─── SETTINGS ────────────────────────────────────────────────────────── */
function renderSettings(){
  const toggle = (key,on) => `<button class="toggle ${on?'on':''}" data-toggle="${key}" type="button" aria-pressed="${on}"></button>`;
  $('#view-settings').innerHTML = `
    <div class="section">
      <div class="section-head"><h2>Appearance</h2></div>
      <div class="setting-panel">
        <div class="setting">
          <div class="info"><b>Dark mode</b><span>Toggle theme across every page.</span></div>
          ${toggle('dark-mode', document.documentElement.getAttribute('data-theme') === 'dark')}
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Matching</h2></div>
      <div class="setting-panel">
        <div class="setting">
          <div class="info"><b>Maximum distance</b><span>Creators beyond this radius won't appear in your feed.</span></div>
          <b style="font-variant-numeric:tabular-nums;font-weight:700" id="maxKmLabel">${state.maxKm} km</b>
        </div>
        <div class="setting" style="padding-top:10px;padding-bottom:18px">
          <input class="range" type="range" min="5" max="100" value="${state.maxKm}" id="maxKmRange" style="flex:1;max-width:none"/>
        </div>
        <div class="setting">
          <div class="info"><b>Show me to others</b><span>When off, your profile is hidden.</span></div>
          ${toggle('discoverable', state.me?.is_discoverable !== false)}
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Account</h2></div>
      <div class="setting-panel">
        <div class="setting">
          <div class="info"><b>Full account settings</b><span>Edit profile, block list, data export, and delete account.</span></div>
          <button class="btn sm" onclick="location.href='account.html'" type="button">Open →</button>
        </div>
        <div class="setting">
          <div class="info"><b>Sign out</b><span>End your session on this device.</span></div>
          <button class="btn sm" id="signOutBtn2" type="button">Sign out</button>
        </div>
      </div>
    </div>`;

  const range = $('#maxKmRange');
  if (range) {
    let t;
    range.addEventListener('input', e => {
      $('#maxKmLabel').textContent = e.target.value + ' km';
      clearTimeout(t);
      t = setTimeout(async () => {
        state.maxKm = Number(e.target.value);
        try { await loadFeed(); toast(`Radius set to ${state.maxKm} km`); render(); }
        catch(err){ toast(err.message || 'Refresh failed', 'err'); }
      }, 500);
    });
  }
  const so = $('#signOutBtn2');
  if (so) so.addEventListener('click', doSignOut);
}

/* ─── SHEET ───────────────────────────────────────────────────────────── */
const backdrop = $('#backdrop');
const sheet = $('#sheet');
const sheetBody = $('#sheetBody');
const sheetFoot = $('#sheetFoot');
const sheetTitle = $('#sheetTitle');

function openSheet(title, body, foot){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = body;
  sheetFoot.innerHTML = foot || '';
  sheetFoot.style.display = foot ? 'flex' : 'none';
  backdrop.classList.add('is-open');
  sheet.classList.add('is-open');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  backdrop.classList.remove('is-open');
  sheet.classList.remove('is-open');
  document.body.style.overflow = '';
}
$('#sheetClose').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

async function openCreator(id){
  if (id === state.me.id) { closeSheet(); navigate('profile'); return; }
  const cached = state.feed.find(c => c.profile_id === id);
  sheetTitle.textContent = cached?.display_name || 'Profile';
  sheetBody.innerHTML = `<div class="empty"><h3>Loading…</h3></div>`;
  sheetFoot.innerHTML = '';
  sheetFoot.style.display = 'none';
  backdrop.classList.add('is-open');
  sheet.classList.add('is-open');
  document.body.style.overflow = 'hidden';

  try {
    const { data: profile, error } = await supabase.rpc('get_profile', { target: id });
    if (error) throw error;
    if (!profile) throw new Error('Profile not found or not discoverable.');

    const m = cached || {};
    const scoreBlock = m.score != null ? `
      <div class="detail-block" style="margin-top:22px">
        <h3>Match breakdown</h3>
        <div class="score-bars">
          ${[
            ['Proximity', m.proximity],
            ['Complementarity', m.complementary],
            ['Niche overlap', m.niche],
            ['Equipment fit', m.equipment],
            ['Space fit', m.space],
            ['Availability', m.availability],
            ['Trust', m.trust]
          ].map(([label, val]) => `
            <div class="score-row">
              <div class="score-row-top"><b>${label}</b><span>${val ?? 0}%</span></div>
              <div class="bar"><div class="bar-fill" style="width:${val ?? 0}%"></div></div>
            </div>`).join('')}
        </div>
      </div>` : '';

    const isSaved = state.savedIds.has(id);
    const isFollowing = profile.is_following || state.followedIds.has(id);
    sheetTitle.textContent = profile.display_name;
    sheetBody.innerHTML = profileBodyHTML(profile, { isSelf: false }) + scoreBlock;

    sheetFoot.style.display = 'flex';
    sheetFoot.innerHTML = `
      <button class="btn ${isFollowing?'is-following':'btn-primary'}" data-action="follow" data-id="${esc(id)}" type="button" id="sheetFollowBtn">
        ${isFollowing ? 'Following' : 'Follow'}
      </button>
      <button class="btn" data-action="message" data-id="${esc(id)}" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4c-1.4 0-2.8-.3-4-1l-5.6 1.6 1.7-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg>
        Say hi
      </button>
      <button class="btn" id="startCollabBtn" type="button">Collab</button>
      <button class="btn ${isSaved?'is-saved':''}" data-action="save" data-id="${esc(id)}" type="button">
        ${isSaved?'Saved':'Save'}
      </button>`;

    const scb = $('#startCollabBtn');
    if (scb) scb.addEventListener('click', () => {
      closeSheet();
      openNewCollabSheet(id, profile.display_name);
    });
  } catch(err){
    sheetBody.innerHTML = `<div class="empty"><h3>Could not load profile</h3><p>${esc(err.message)}</p></div>`;
  }
}

function openNewCollabSheet(partnerId, partnerName){
  openSheet('New collab', `
    <div class="field" style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px">Title</label>
      <input id="ncTitle" type="text" placeholder="e.g. Tech review B-roll swap" maxlength="120" style="width:100%;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14.5px;color:var(--text)"/>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px">Summary (optional)</label>
      <textarea id="ncSummary" placeholder="What are you building together?" rows="3" style="width:100%;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14.5px;color:var(--text);resize:vertical;font-family:inherit"></textarea>
    </div>
    <p style="font-size:12.5px;color:var(--text-3);line-height:1.55">${esc(partnerName)} will be invited as a partner.</p>
  `, `
    <button class="btn" id="ncCancel" type="button">Cancel</button>
    <button class="btn btn-primary" id="ncCreate" type="button">Create</button>`);

  const cancel = $('#ncCancel');
  if (cancel) cancel.addEventListener('click', closeSheet);

  const create = $('#ncCreate');
  if (create) create.addEventListener('click', async () => {
    const title = $('#ncTitle').value.trim();
    if (title.length < 2) return toast('Title required', 'err');
    const summary = $('#ncSummary').value.trim();
    create.classList.add('is-loading'); create.disabled = true;
    try {
      const { error } = await supabase.rpc('create_collab', {
        p_title: title, p_summary: summary, p_partners: [partnerId]
      });
      if (error) throw error;
      toast('Collab created');
      closeSheet();
      await loadCollabs();
      navigate('collabs');
    } catch(err){
      toast(err.message || 'Create failed', 'err');
    } finally {
      create.classList.remove('is-loading'); create.disabled = false;
    }
  });
}

/* ─── EVENTS ──────────────────────────────────────────────────────────── */
document.addEventListener('click', async e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { navigate(navBtn.dataset.nav); return; }

  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    const on = !tg.classList.contains('on');
    tg.classList.toggle('on', on);
    tg.setAttribute('aria-pressed', on);
    if (tg.dataset.toggle === 'dark-mode'){
      const next = on ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('timcrenet-theme', next);
      $('#metaThemeColor').setAttribute('content', next==='light' ? '#FAF9F7' : '#0A0B0F');
    }
    if (tg.dataset.toggle === 'discoverable'){
      const { error } = await supabase.from('profiles').update({ is_discoverable: on }).eq('id', state.me.id);
      if (error){ toast('Could not update', 'err'); tg.classList.toggle('on', !on); }
      else { state.me.is_discoverable = on; toast(on ? 'Visible to others' : 'Hidden'); }
    }
    return;
  }

  const act = e.target.closest('[data-action]');
  if (!act) return;
  const { action, id } = act.dataset;

  if (action === 'view'){ openCreator(id); return; }

  if (action === 'save'){
    act.classList.add('is-loading');
    try {
      const { data, error } = await supabase.rpc('toggle_save', { target: id });
      if (error) throw error;
      if (data) state.savedIds.add(id); else state.savedIds.delete(id);
      updateSavedBadge();
      toast(data ? 'Saved' : 'Removed');
      render();
      if (sheet.classList.contains('is-open')){
        const foot = sheetFoot.querySelector('[data-action="save"]');
        if (foot){
          const now = state.savedIds.has(id);
          foot.classList.toggle('is-saved', now);
          foot.textContent = now ? 'Saved' : 'Save';
        }
      }
    } catch(err){ toast(err.message || 'Save failed', 'err'); }
    finally { act.classList.remove('is-loading'); }
    return;
  }

  if (action === 'follow'){
    if (id === state.me.id){ toast('Cannot follow yourself', 'err'); return; }
    act.classList.add('is-loading');
    try {
      const { data, error } = await supabase.rpc('toggle_follow', { target: id });
      if (error) throw error;
      if (data) state.followedIds.add(id); else state.followedIds.delete(id);
      toast(data ? 'Following' : 'Unfollowed');
      render();
      if (sheet.classList.contains('is-open')){
        const foot = sheetFoot.querySelector('[data-action="follow"]');
        if (foot){
          const now = state.followedIds.has(id);
          foot.classList.toggle('is-following', now);
          foot.classList.toggle('btn-primary', !now);
          foot.textContent = now ? 'Following' : 'Follow';
        }
        const inline = sheetBody.querySelector('[data-action="follow"]');
        if (inline){
          const now = state.followedIds.has(id);
          inline.classList.toggle('is-following', now);
          inline.classList.toggle('btn-primary', !now);
          inline.textContent = now ? 'Following' : 'Follow';
        }
      }
    } catch(err){
      console.error('toggle_follow error:', err);
      toast(err.message || 'Could not update follow', 'err');
    } finally { act.classList.remove('is-loading'); }
    return;
  }

  if (action === 'delete-post'){
    const pid = act.dataset.postId;
    if (!pid) return;
    if (!confirm('Delete this post? This cannot be undone.')) return;
    act.classList.add('is-loading');
    try {
      const { error } = await supabase.rpc('delete_post', { p_id: pid });
      if (error) throw error;
      toast('Post deleted');
      state.posts = state.posts.filter(p => p.id !== pid);
      updatePostsBadge();
      render();
    } catch(err){
      toast(err.message || 'Delete failed', 'err');
    } finally { act.classList.remove('is-loading'); }
    return;
  }

  if (action === 'message'){
    closeSheet();
    await startDM(id);
    return;
  }
});

async function startDM(otherId){
  if (!otherId || otherId === state.me.id){ toast('Cannot chat with yourself', 'err'); return; }
  try {
    const { data: cid, error } = await supabase.rpc('find_or_create_dm', { other_user: otherId });
    if (error) throw error;
    await loadConversations();
    await openConversation(cid);
    navigate('messages');
  } catch(err){
    toast(err.message || 'Could not open chat', 'err');
  }
}

$('#globalSearch').addEventListener('input', e => {
  state.searchQuery = e.target.value;
  if (state.view === 'explore') renderExplore();
  else if (state.view === 'home' && state.searchQuery.trim()) navigate('explore');
});

$('#meBtn').addEventListener('click', () => navigate('profile'));

async function refreshFeed(){
  const btn = $('#refreshBtn');
  btn.disabled = true;
  try {
    await loadFeed();
    await loadPosts();
    await loadConversations();
    await loadCollabs();
    await loadNotifications();
    render();
    toast('Everything refreshed');
  } catch(err){ toast(err.message || 'Refresh failed', 'err'); }
  finally { btn.disabled = false; }
}
$('#refreshBtn').addEventListener('click', refreshFeed);

async function doSignOut(){
  if (state.messageChannel){ try { await supabase.removeChannel(state.messageChannel); } catch(e){} }
  state.messageChannel = null;
  state.subscribedConvId = null;
  await supabase.auth.signOut();
  location.href = SIGNIN_URL;
}
$('#signOutBtn').addEventListener('click', doSignOut);

setInterval(() => {
  if (document.hidden) return;
  loadNotifications().catch(()=>{});
}, 30000);
</script>
