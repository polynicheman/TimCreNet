<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0B0F" id="metaThemeColor" />
<title>TIMCRENET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F; --bg-elev:#0F1117; --surface:#14161E; --surface-2:#1B1E28; --surface-3:#242833;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
  --text:#F0F1F5; --text-2:#9698A6; --text-3:#5D5F70;
  --primary:#FF6B3D; --primary-soft:rgba(255,107,61,.14); --primary-glow:rgba(255,107,61,.4);
  --secondary:#FFB347; --secondary-soft:rgba(255,179,71,.14);
  --accent:#7C6BFF; --accent-soft:rgba(124,107,255,.14);
  --success:#3DD68C; --success-soft:rgba(61,214,140,.13);
  --warning:#FFB547; --warning-soft:rgba(255,181,71,.13);
  --danger:#FF5A6E; --danger-soft:rgba(255,90,110,.13);
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px; --radius-xl:28px; --radius-full:999px;
  --shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);
  --shadow-md:0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -28px rgba(0,0,0,.9);
  --sidebar-w:264px; --topbar-h:68px; --tabbar-h:66px;
  --grad-primary:linear-gradient(135deg,#FF6B3D 0%,#FF8F5C 40%,#FFB347 100%);
  --grad-warm:linear-gradient(135deg,#FF6B3D 0%,#FF4D8F 100%);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FAF9F7; --bg-elev:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F3F0; --surface-3:#EDEAE5;
  --border:rgba(20,15,10,.08); --border-strong:rgba(20,15,10,.15);
  --text:#0F0F12; --text-2:#5B5A66; --text-3:#8E8C99;
  --primary:#E5552A; --primary-soft:rgba(229,85,42,.1); --primary-glow:rgba(229,85,42,.3);
  --secondary:#D18B1F; --secondary-soft:rgba(209,139,31,.12);
  --accent:#6A54F0; --accent-soft:rgba(106,84,240,.1);
  --success:#119F68; --success-soft:rgba(17,159,104,.11);
  --warning:#C28A0E; --warning-soft:rgba(194,138,14,.12);
  --danger:#DC2F45; --danger-soft:rgba(220,47,69,.1);
  --shadow-sm:0 4px 14px -8px rgba(30,20,10,.15);
  --shadow-md:0 12px 32px -16px rgba(30,20,10,.18);
  --shadow-lg:0 24px 60px -28px rgba(30,20,10,.22);
  --grad-primary:linear-gradient(135deg,#E5552A 0%,#F0703F 40%,#D18B1F 100%);
  --grad-warm:linear-gradient(135deg,#E5552A 0%,#D93D7A 100%);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:15px; line-height:1.5; letter-spacing:-.005em;
  overflow:hidden; transition:background .3s ease,color .3s ease;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
svg{display:block;max-width:100%}
::selection{background:var(--primary);color:#fff}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:3px solid transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{
  width:var(--sidebar-w);flex:none;
  background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:22px 14px 14px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:var(--grad-primary);display:grid;place-items:center;
  position:relative;box-shadow:0 8px 22px -10px var(--primary-glow);
}
.brand-mark::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 60%);
  mix-blend-mode:overlay;
}
.brand-mark svg{width:19px;height:19px;position:relative;z-index:1}
.brand-mark svg *{stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round}
.brand-mark svg .node{fill:#fff;stroke:none}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-size:15.5px;font-weight:800;letter-spacing:-.5px}
.brand-text span{font-size:10.5px;color:var(--text-3);font-weight:500}

.nav{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.nav-label{font-size:10.5px;letter-spacing:.09em;color:var(--text-3);font-weight:700;
  padding:16px 12px 8px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;
  color:var(--text-2);font-size:14px;font-weight:500;
  transition:background .16s,color .16s;
  position:relative;text-align:left;width:100%;min-height:44px;
}
.nav-item svg{width:20px;height:20px;flex:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.is-active{background:var(--primary-soft);color:var(--text);font-weight:600}
.nav-item.is-active svg{color:var(--primary);stroke-width:2.1}
.nav-item .badge{
  margin-left:auto;background:var(--primary);color:#fff;
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;
  min-width:20px;text-align:center;
}
.nav-item .badge.soft{background:var(--surface-3);color:var(--text-2)}

.sidebar-cta{margin:18px 4px 8px}
.scout-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 16px;border-radius:14px;
  background:var(--grad-warm);color:#fff;
  font-weight:700;font-size:13.5px;
  box-shadow:0 14px 30px -14px var(--primary-glow);
  transition:transform .18s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.scout-btn::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.scout-btn:hover{transform:translateY(-1px)}
.scout-btn:active{transform:scale(.98)}
.scout-btn:disabled{opacity:.6;cursor:wait}
.scout-btn svg{width:17px;height:17px;stroke-width:2.4;position:relative;z-index:1}

.sidebar-foot{margin-top:auto;padding-top:14px}
.mini-profile{
  display:flex;align-items:center;gap:10px;
  padding:10px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:border-color .16s;width:100%;
}
.mini-profile:hover{border-color:var(--border-strong)}
.mini-profile .avatar{width:36px;height:36px;font-size:12.5px}
.mini-profile .info{min-width:0;flex:1;text-align:left}
.mini-profile .info b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-profile .info span{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-profile .rel{
  font-size:10.5px;font-weight:700;color:var(--success);
  background:var(--success-soft);padding:3px 8px;border-radius:20px;flex:none;
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:12px 28px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  min-height:var(--topbar-h);z-index:20;
}
.topbar-title{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.topbar-title h1{font-size:18px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title p{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.topbar-actions{display:flex;align-items:center;gap:9px;flex:none}

.searchbox{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-full);padding:9px 16px;min-width:260px;max-width:360px;
}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.searchbox svg{width:16px;height:16px;color:var(--text-3);flex:none;stroke-width:2.2}
.searchbox input{width:100%;font-size:13.5px;font-weight:500}
.searchbox input::placeholder{color:var(--text-3)}

.icon-btn{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);position:relative;
  transition:background .16s,color .16s,border-color .16s,transform .16s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.theme-btn{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);position:relative;overflow:hidden;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
}
.theme-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong);transform:scale(1.04)}
.theme-btn svg{width:19px;height:19px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:absolute;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .3s}
.theme-btn .icon-sun{transform:rotate(0) scale(1);opacity:0}
.theme-btn .icon-moon{transform:rotate(0) scale(1);opacity:1}
[data-theme="light"] .theme-btn .icon-sun{opacity:1;transform:rotate(360deg) scale(1)}
[data-theme="light"] .theme-btn .icon-moon{opacity:0;transform:rotate(-180deg) scale(.5)}

.viewport{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.view{display:none;padding:28px;max-width:1160px;margin:0 auto;animation:fadeUp .35s cubic-bezier(.4,0,.2,1);width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.is-active{display:block}
.view.no-pad.is-active{display:flex;padding:0;max-width:none;overflow:hidden;flex-direction:column}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.avatar{
  border-radius:14px;flex:none;display:grid;place-items:center;
  font-weight:800;color:#fff;letter-spacing:-.5px;
  position:relative;overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.35);
}
.avatar::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%);mix-blend-mode:overlay}
.avatar.lg{width:92px;height:92px;border-radius:28px;font-size:30px}
.avatar.md{width:52px;height:52px;border-radius:16px;font-size:18px}
.avatar.sm{width:40px;height:40px;border-radius:13px;font-size:14px}
.avatar.xs{width:30px;height:30px;border-radius:10px;font-size:11.5px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);transition:all .16s;white-space:nowrap;min-height:38px;
}
.btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke-width:2.2;flex:none;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--grad-warm);border-color:transparent;color:#fff;box-shadow:0 10px 22px -12px var(--primary-glow)}
.btn-primary:hover{color:#fff;filter:brightness(1.06)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px;min-height:34px}
.btn.full{width:100%}
.btn.is-saved{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.is-following{background:var(--surface-2);border-color:var(--border-strong);color:var(--text-2)}
.btn.is-following:hover{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.is-following:hover::after{content:"Unfollow";position:absolute}
.btn.is-loading{pointer-events:none;color:transparent;position:relative}
.btn.is-loading::after{
  content:"";position:absolute;width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;
}
.btn:not(.btn-primary).is-loading::after{border-color:var(--border-strong);border-top-color:var(--text-2)}
@keyframes spin{to{transform:rotate(360deg)}}

.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.tag-need{background:var(--danger-soft);color:var(--danger)}
.tag-give{background:var(--success-soft);color:var(--success)}
.tag-niche{background:var(--accent-soft);color:var(--accent)}
.tag-space{background:var(--warning-soft);color:var(--warning)}
.tag-neutral{background:var(--surface-2);color:var(--text-2)}
.tag-sev-3{box-shadow:inset 0 0 0 1px currentColor}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag-block{display:flex;flex-direction:column;gap:8px}
.tag-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:8px}
.tag-label::after{content:"";flex:1;height:1px;background:var(--border)}

.feed{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;
  transition:border-color .2s,transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0 auto auto 0;height:2px;width:100%;
  background:var(--grad-primary);opacity:0;transition:opacity .25s}
@media (hover:hover){
  .card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow-md)}
  .card:hover::before{opacity:1}
}
.card-head{display:flex;gap:14px;align-items:flex-start}
.card-head .who{flex:1;min-width:0}
.name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name-row h3{font-size:16px;font-weight:800;letter-spacing:-.4px}
.name-row .handle{font-size:12.5px;color:var(--text-3);font-weight:500}
.meta{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px;font-weight:500}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex:none}
.meta b{color:var(--text);font-weight:700}

.ring-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring text{fill:var(--text);font-family:"Plus Jakarta Sans",sans-serif;font-weight:800}
.ring-cap{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

.card-body{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.reasons{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:12px 14px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);
}
.reasons-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-right:4px}
.reason{font-size:12px;font-weight:600;color:var(--secondary);display:inline-flex;align-items:center;gap:5px}
.reason::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--secondary)}

.card-actions{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.card-actions .spacer{flex:1}

.post-card .card-body{gap:12px}
.post-title{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.3;color:var(--text)}
.post-body{
  font-size:14.5px;line-height:1.65;color:var(--text);
  white-space:pre-wrap;word-wrap:break-word;font-weight:500;
}
.post-card .card-head{align-items:center}

.posts-filter{display:flex;gap:6px;flex-wrap:wrap}
.posts-filter .chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:20px;
  font-size:12.5px;font-weight:600;color:var(--text-2);
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all .16s;
}
.posts-filter .chip:hover{border-color:var(--border-strong);color:var(--text)}
.posts-filter .chip.is-active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

.hero{
  background:
    radial-gradient(900px 300px at 10% -40%, var(--primary-soft), transparent 65%),
    radial-gradient(700px 260px at 95% 130%, var(--accent-soft), transparent 65%),
    var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:28px;margin-bottom:26px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
  background:var(--grad-primary);opacity:.08;border-radius:50%;filter:blur(40px);pointer-events:none}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-bottom:8px}
.hero p{color:var(--text-2);font-size:14px;max-width:620px;line-height:1.6;font-weight:500}
.hero p b{color:var(--text);font-weight:700}
.hero-stats{display:flex;gap:32px;margin-top:22px;flex-wrap:wrap}
.hero-stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:11.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.hero-actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.section{margin-bottom:32px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-head h2{font-size:16px;font-weight:800;letter-spacing:-.3px}
.section-head .count{font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--surface-2);padding:3px 10px;border-radius:20px}
.section-head .spacer{flex:1}

.empty{
  padding:64px 24px;text-align:center;color:var(--text-3);
  border:1px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:var(--surface);
}
.empty svg{width:40px;height:40px;margin-bottom:16px;opacity:.35;margin-left:auto;margin-right:auto;stroke-width:1.5}
.empty h3{font-size:15px;color:var(--text-2);margin-bottom:6px;font-weight:700}
.empty p{font-size:13px;max-width:340px;margin:0 auto;line-height:1.55}

.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.profile-hero{display:flex;gap:20px;align-items:flex-start;padding-bottom:24px;border-bottom:1px solid var(--border)}
.profile-hero .info{flex:1;min-width:0}
.profile-hero h2{font-size:24px;font-weight:800;letter-spacing:-.7px}
.profile-hero .handle{font-size:13.5px;color:var(--text-3);margin-top:3px;font-weight:500}
.profile-hero .meta{margin-top:10px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.stat.clickable{cursor:pointer;transition:border-color .16s}
.stat.clickable:hover{border-color:var(--border-strong)}

.detail-block{margin-bottom:26px}
.detail-block h3{
  font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.detail-block h3::after{content:"";flex:1;height:1px;background:var(--border)}

.score-bars{display:flex;flex-direction:column;gap:12px}
.score-row{display:flex;flex-direction:column;gap:5px}
.score-row-top{display:flex;justify-content:space-between;font-size:12.5px}
.score-row-top b{font-weight:600;color:var(--text-2)}
.score-row-top span{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:var(--grad-primary);transition:width .6s cubic-bezier(.2,.8,.2,1)}

.inv-item{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);margin-bottom:9px}
.inv-item .icon{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.inv-item .icon svg{width:18px;height:18px;stroke-width:1.9}
.inv-item .info{flex:1;min-width:0}
.inv-item .info b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item .info span{display:block;font-size:12px;color:var(--text-3);margin-top:2px;font-weight:500}
.inv-item .terms{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;flex:none}

.setting-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 22px;margin-bottom:22px}
.setting{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.setting:last-child{border-bottom:none}
.setting .info{flex:1;min-width:0}
.setting .info b{display:block;font-size:13.5px;font-weight:700}
.setting .info span{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.5;font-weight:500}
.toggle{width:48px;height:28px;border-radius:20px;background:var(--surface-3);position:relative;flex:none;transition:background .22s;border:1px solid var(--border);cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--text-3);transition:transform .22s cubic-bezier(.4,0,.2,1),background .22s}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle.on::after{transform:translateX(20px);background:#fff}
.range{accent-color:var(--primary);flex:1;min-width:0;max-width:180px}

.messages-layout{display:grid;grid-template-columns:320px 1fr;height:100%;overflow:hidden}
.convo-sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-elev);overflow:hidden}
.convo-head{flex:none;padding:18px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.convo-head h2{font-size:16px;font-weight:800;letter-spacing:-.3px}
.convo-head .searchbox{min-width:0;max-width:none;padding:8px 14px}
.convo-scroll{flex:1;overflow-y:auto;padding:8px}
.convo-item{
  display:flex;gap:12px;padding:12px;border-radius:14px;
  cursor:pointer;transition:background .16s;width:100%;text-align:left;
  align-items:center;border:1px solid transparent;position:relative;
}
.convo-item:hover{background:var(--surface-2)}
.convo-item.is-active{background:var(--primary-soft);border-color:var(--primary)}
.convo-item .info{flex:1;min-width:0}
.convo-item .top{display:flex;align-items:baseline;gap:8px}
.convo-item .top b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.convo-item .top time{margin-left:auto;font-size:11px;color:var(--text-3);flex:none}
.convo-item .preview{font-size:12.5px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-item .unread{
  position:absolute;right:14px;bottom:12px;
  background:var(--primary);color:#fff;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:20px;display:grid;place-items:center;padding:0 5px;
}
.convo-item .group-badge{font-size:9.5px;font-weight:800;letter-spacing:.05em;
  background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;margin-left:2px}

.chat-pane{display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-elev)}
.chat-head .info{flex:1;min-width:0}
.chat-head .info b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .info span{display:block;font-size:12px;color:var(--text-3);font-weight:500}
.back-btn{display:none}

.msg-list{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:4px}
.day-sep{align-self:center;font-size:10.5px;font-weight:700;color:var(--text-3);
  background:var(--surface-2);padding:5px 14px;border-radius:20px;margin:16px 0;
  text-transform:uppercase;letter-spacing:.08em}
.msg{display:flex;gap:10px;max-width:74%;margin-top:4px}
.msg.first{margin-top:16px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{
  background:var(--surface-2);padding:11px 15px;border-radius:18px;
  border-top-left-radius:6px;font-size:14px;line-height:1.5;
  word-wrap:break-word;font-weight:500;
}
.msg.me .bubble{background:var(--grad-warm);color:#fff;border-top-left-radius:18px;border-top-right-radius:6px;box-shadow:0 8px 20px -12px var(--primary-glow)}
.msg.first .bubble{border-top-left-radius:18px}
.msg.first.me .bubble{border-top-right-radius:18px}
.msg-meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-3);margin-top:5px;padding:0 4px;font-weight:500}
.msg.me .msg-meta{justify-content:flex-end}
.msg-col{display:flex;flex-direction:column;min-width:0}

.composer{flex:none;border-top:1px solid var(--border);padding:14px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg-elev)}
.composer-row{display:flex;align-items:flex-end;gap:10px}
.composer textarea{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:12px 16px;resize:none;
  font-size:14px;max-height:130px;min-height:46px;line-height:1.45;
  font-family:inherit;font-weight:500;
}
.composer textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.send-btn{
  width:46px;height:46px;border-radius:14px;flex:none;
  background:var(--grad-warm);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 22px -12px var(--primary-glow);
  transition:transform .16s;
}
.send-btn:hover{transform:scale(1.05)}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.send-btn svg{width:18px;height:18px;stroke-width:2.2}

.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--text-3)}
.empty-chat svg{width:56px;height:56px;opacity:.3;margin-bottom:18px;stroke-width:1.5}
.empty-chat h3{font-size:16px;color:var(--text-2);font-weight:700;margin-bottom:6px}
.empty-chat p{font-size:13px;max-width:320px;line-height:1.55}

.collab-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;display:flex;flex-direction:column;gap:14px;
  transition:border-color .2s,transform .2s;
}
@media (hover:hover){.collab-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-sm)}}
.collab-top{display:flex;align-items:center;gap:12px}
.collab-top .info{flex:1;min-width:0}
.collab-top .info b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.collab-top .info span{font-size:12px;color:var(--text-3);font-weight:500}
.status-pill{font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:20px;text-transform:uppercase;letter-spacing:.07em;flex:none}
.status-proposed{background:var(--warning-soft);color:var(--warning)}
.status-active{background:var(--success-soft);color:var(--success)}
.status-completed{background:var(--surface-3);color:var(--text-2)}
.status-cancelled{background:var(--danger-soft);color:var(--danger)}
.progress-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);font-weight:600}
.progress-row .bar{flex:1}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-10px;border:2.5px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}

.notif{
  display:flex;gap:14px;padding:16px;border-radius:var(--radius-md);
  background:var(--surface);border:1px solid var(--border);margin-bottom:10px;
  transition:border-color .16s;
}
.notif:hover{border-color:var(--border-strong)}
.notif.unread{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));background:linear-gradient(90deg,var(--primary-soft),transparent 55%),var(--surface)}
.notif .icon{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center}
.notif .icon svg{width:18px;height:18px;stroke-width:2}
.notif .body{flex:1;min-width:0}
.notif .body p{font-size:13.5px;line-height:1.55;font-weight:500}
.notif .body b{font-weight:700}
.notif .body time{font-size:11.5px;color:var(--text-3);display:block;margin-top:5px;font-weight:500}

.map-shell{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--border);height:520px;background:#0D0E14;
}
[data-theme="light"] .map-shell{background:#EFEDE9}
.map-canvas{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,107,61,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,107,61,.06) 1px,transparent 1px),
    radial-gradient(700px 400px at 50% 50%,rgba(255,107,61,.1),transparent 70%);
  background-size:44px 44px,44px 44px,100% 100%;
}
.map-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(255,107,61,.3);pointer-events:none}
.map-pin{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:2;
}
.map-pin:hover{transform:translate(-50%,-50%) scale(1.14);z-index:9}
.map-pin .pin-dot{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;
  border:2.5px solid var(--bg);box-shadow:0 10px 24px -8px rgba(0,0,0,.8);
  text-shadow:0 1px 5px rgba(0,0,0,.4);
}
.map-pin .pin-label{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  white-space:nowrap;opacity:0;transition:opacity .22s;
  box-shadow:var(--shadow-sm);
}
.map-pin:hover .pin-label{opacity:1}
.me-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.me-pin .core{width:20px;height:20px;border-radius:50%;background:var(--primary);border:3px solid var(--bg);
  box-shadow:0 0 0 8px var(--primary-soft),0 0 20px var(--primary-glow)}
.me-pin .halo{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--primary);
  animation:halo 2.4s infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.map-legend{
  position:absolute;left:16px;bottom:16px;z-index:10;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;display:flex;flex-direction:column;gap:9px;
}
.legend-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2);font-weight:500}
.legend-swatch{width:12px;height:12px;border-radius:4px;flex:none}

.sheet-backdrop{
  position:fixed;inset:0;background:rgba(4,5,10,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;
}
.sheet-backdrop.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;height:100dvh;width:min(600px,100vw);
  background:var(--bg-elev);border-left:1px solid var(--border);
  z-index:101;transform:translateX(102%);
  transition:transform .36s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.sheet.is-open{transform:translateX(0)}
.sheet-head{flex:none;display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:16px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--surface);flex-wrap:wrap}
.sheet-foot .btn{flex:1;min-width:0}

.user-list{display:flex;flex-direction:column;gap:10px}
.user-list .user-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--radius-md);
  background:var(--surface);border:1px solid var(--border);
}
.user-list .user-row .info{flex:1;min-width:0}
.user-list .user-row .info b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-list .user-row .info span{display:block;font-size:12px;color:var(--text-3);margin-top:2px;font-weight:500}

.toast-root{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;
  pointer-events:none;max-width:calc(100vw - 32px);
}
.toast{
  background:var(--surface-3);border:1px solid var(--border-strong);
  color:var(--text);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;
}
.toast svg{width:16px;height:16px;color:var(--success);flex:none;stroke-width:2.4}
.toast.err svg{color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}

.boot{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;
  background:
    radial-gradient(900px 500px at 50% 0%, var(--primary-soft), transparent 65%),
    radial-gradient(700px 400px at 50% 100%, var(--accent-soft), transparent 65%),
    var(--bg);
}
.boot-mark{width:64px;height:64px;border-radius:20px;flex:none;background:var(--grad-primary);
  display:grid;place-items:center;box-shadow:0 18px 42px -14px var(--primary-glow);
  position:relative;animation:bootPulse 2s ease-in-out infinite}
@keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.boot-mark::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 62%);mix-blend-mode:overlay}
.boot-mark svg{width:36px;height:36px;position:relative;z-index:1}
.boot-mark svg *{stroke:#fff;stroke-width:1.7;fill:none;stroke-linecap:round}
.boot-mark svg .node{fill:#fff;stroke:none}
.boot-text{font-size:13px;color:var(--text-3);font-weight:600}
.boot.is-hidden{opacity:0;pointer-events:none;transition:opacity .4s}

.error-screen{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:32px;background:var(--bg);overflow-y:auto}
.error-screen.is-open{display:flex}
.error-card{max-width:600px;background:var(--surface);border:1px solid var(--danger);border-radius:var(--radius-lg);padding:32px}
.error-card h2{font-size:19px;font-weight:800;color:var(--danger);margin-bottom:12px}
.error-card p{font-size:13.5px;color:var(--text-2);line-height:1.65;margin-bottom:14px}
.error-card code{display:inline-block;background:var(--surface-2);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.error-card .btn{margin-top:8px;margin-right:8px}

.tabbar{display:none}

@media (max-width:900px){
  :root{--sidebar-w:0px;--topbar-h:62px}
  .app{height:calc(100dvh - var(--tabbar-h))}
  .sidebar{display:none}
  .topbar{padding:10px 16px;gap:10px}
  .topbar-title h1{font-size:17px}
  .topbar-title p{display:none}
  .topbar-actions{gap:8px}
  .searchbox{min-width:0;flex:1;max-width:none;padding:8px 14px}
  .searchbox input{font-size:13px}
  .view{padding:18px 16px 32px}
  .card{padding:17px;border-radius:18px}
  .hero{padding:20px;border-radius:22px}
  .hero h2{font-size:20px}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--tabbar-h);
    background:color-mix(in srgb,var(--bg-elev) 94%,transparent);
    backdrop-filter:blur(22px) saturate(1.4);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);
    border-top:1px solid var(--border);z-index:60;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;color:var(--text-3);font-size:10px;font-weight:700;position:relative;
    transition:color .16s;min-height:56px;
  }
  .tab-item svg{width:22px;height:22px;stroke-width:1.9}
  .tab-item.is-active{color:var(--primary)}
  .tab-item .badge{position:absolute;top:8px;right:calc(50% - 22px);
    background:var(--primary);color:#fff;font-size:9px;font-weight:800;
    min-width:16px;height:16px;border-radius:20px;display:grid;place-items:center;padding:0 4px}
  .sheet{top:auto;bottom:0;right:0;left:0;width:100vw;height:auto;max-height:92dvh;
    border-left:none;border-top:1px solid var(--border);border-radius:22px 22px 0 0;transform:translateY(102%)}
  .sheet.is-open{transform:translateY(0)}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:20px;background:var(--border-strong);margin:10px auto 0}
  .sheet-head{padding-top:12px}
  .sheet-body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .grid-2{grid-template-columns:1fr}
  .section{margin-bottom:24px}
  .stat-strip{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:11px 6px}
  .stat b{font-size:17px}
  .profile-hero{gap:16px}
  .profile-hero h2{font-size:20px}
  .avatar.lg{width:76px;height:76px;border-radius:24px;font-size:26px}
  .card-actions{gap:7px}
  .card-actions .btn{flex:1;justify-content:center;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

  .messages-layout{grid-template-columns:1fr}
  .messages-layout.show-thread .convo-sidebar{display:none}
  .messages-layout:not(.show-thread) .chat-pane{display:none}
  .back-btn{display:grid}
}
@media (max-width:640px){
  .view{padding:14px 14px 26px}
  .card{padding:16px;border-radius:16px}
  .hero{padding:18px;border-radius:20px}
  .hero h2{font-size:18px}
  .hero p{font-size:13px}
  .hero-stat b{font-size:19px}
  .card-head{gap:12px}
  .name-row h3{font-size:15px}
  .meta{font-size:12px}
  .section-head h2{font-size:15px}
  .avatar.md{width:48px;height:48px;border-radius:15px;font-size:17px}
  .toast-root{bottom:calc(var(--tabbar-h) + 14px)}
  .msg-list{padding:16px}
  .msg{max-width:86%}
  .msg .bubble{padding:10px 14px;font-size:13.5px}
  .composer{padding:12px 14px}
  .map-shell{height:400px}
  .map-pin .pin-dot{width:36px;height:36px;border-radius:12px;font-size:12px}
  .post-title{font-size:16px}
  .post-body{font-size:14px}
}
@media (max-width:400px){
  .topbar{padding:9px 12px;gap:8px}
  .topbar-title h1{font-size:16px}
  .theme-btn,.icon-btn{width:40px;height:40px;border-radius:11px}
  .view{padding:12px 12px 24px}
  .tab-item span{display:none}
  .tab-item svg{width:23px;height:23px}
}
</style>
</head>
<body>

<div class="boot" id="bootScreen">

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   TIMCRENET · app.html — Posts + Follows + external page links
   ══════════════════════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://zwzryfzmfgkfwpxznypn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3enJ5ZnptZmdrZndweHpueXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzAwNjksImV4cCI6MjEwNjg0NjA2OX0.ShUxUIUhKNmWSxElZQXWJNTe4g2m_YtDRgjSPVWVWuo';

const SIGNIN_URL     = 'index.html';
const ONBOARDING_URL = 'onboarding.html';

const trimmedUrl = SUPABASE_URL.trim();
const trimmedKey = SUPABASE_ANON_KEY.trim();
const urlLooksValid = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(trimmedUrl);
const keyLooksValid = trimmedKey.split('.').length === 3 && trimmedKey.length > 100;

function fatal(title, html, actions = '') {
  document.getElementById('bootScreen').style.display = 'none';
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorBody').innerHTML = html;
  document.getElementById('errorActions').innerHTML = actions;
  document.getElementById('errorScreen').classList.add('is-open');
}

if (!urlLooksValid || !keyLooksValid) {
  fatal('Supabase credentials not set', '<p>Open app.html and paste your URL + anon key.</p>');
  throw new Error('invalid config');
}

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const supabase = createClient(trimmedUrl, trimmedKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'timcrenet.auth' },
  global: { headers: { 'x-application-name': 'timcrenet-web' } }
});

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function avatarStyle(seed){
  const h = hashStr(String(seed || 'x'));
  const a = h % 360, b = (a+55+(h>>3)%110)%360, c = (a+210+(h>>7)%90)%360, ang = h%360;
  return `background:conic-gradient(from ${ang}deg, hsl(${a} 72% 58%), hsl(${b} 70% 54%), hsl(${c} 74% 60%), hsl(${a} 72% 58%));`;
}
function avatarHTML(seed, initials, size='md'){
  return `<div class="avatar ${size}" style="${avatarStyle(seed)}">${esc(initials || '··')}</div>`;
}
function ringSVG(score, size=58, stroke=5){
  const s = Math.max(0, Math.min(100, Number(score)||0));
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-s/100);
  const col = s>=88?'var(--success)':s>=74?'var(--secondary)':'var(--warning)';
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*0.3)}" font-weight="800">${s}</text>
  </svg>`;
}
function timeAgo(iso){
  if (!iso) return '';
  const d = new Date(iso), s = Math.floor((Date.now() - d.getTime())/1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return m + 'm';
  const h = Math.floor(m/60); if (h < 24) return h + 'h';
  const dd = Math.floor(h/24); if (dd < 7) return dd + 'd';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function timeShort(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
}
function dayKey(iso){ return new Date(iso).toDateString(); }
function dayLabel(iso){
  const d = new Date(iso);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  if (dd.getTime() === today.getTime()) return 'Today';
  if (dd.getTime() === yesterday.getTime()) return 'Yesterday';
  return d.toLocaleDateString(undefined, {month:'long', day:'numeric', year:'numeric'});
}

function toast(text, kind='ok'){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':'');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${
    kind==='err'
      ? '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'
      : '<path d="M20 6 9 17l-5-5"/>'
  }</svg><span>${esc(text)}</span>`;
  $('#toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(12px)';
    setTimeout(() => el.remove(), 320);
  }, 2600);
}

(function initTheme(){
  const saved = localStorage.getItem('timcrenet-theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (prefersLight ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  $('#metaThemeColor').setAttribute('content', theme==='light' ? '#FAF9F7' : '#0A0B0F');
})();
$('#themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('timcrenet-theme', next);
  $('#metaThemeColor').setAttribute('content', next==='light' ? '#FAF9F7' : '#0A0B0F');
});

/* ─── state ───────────────────────────────────────────────────────────── */
const state = {
  view: 'home',
  me: null,
  feed: [],
  savedIds: new Set(),
  followedIds: new Set(),
  searchQuery: '',
  maxKm: 60,
  conversations: [],
  activeConvId: null,
  activeMessages: [],
  messageChannel: null,
  subscribedConvId: null,
  mobileShowThread: false,
  collabs: [],
  notifications: [],
  posts: [],
  postScope: 'all'
};

const VIEW_META = {
  home:          { title:'For you',    sub:'Creators near you whose gaps match your strengths' },
  posts:         { title:'Posts',      sub:'What creators are sharing right now' },
  explore:       { title:'Explore',    sub:'Search by name, skill, niche or city' },
  map:           { title:'Nearby',     sub:'Everyone within reach, plotted' },
  saved:         { title:'Saved',      sub:'Creators you bookmarked for later' },
  messages:      { title:'Messages',   sub:'Direct chats and group pods' },
  collabs:       { title:'Collabs',    sub:'Active and proposed partnerships' },
  notifications: { title:'Activity',   sub:'Matches, messages, collabs, sessions' },
  profile:       { title:'Profile',    sub:'Your struggles, advantages, gear and time' },
  settings:      { title:'Settings',   sub:'Privacy, matching and appearance' }
};

/* ─── boot ────────────────────────────────────────────────────────────── */
(async function boot(){
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.href = SIGNIN_URL; return; }

    const { data: profile, error } = await supabase
      .from('profiles')
      .select('id, handle, display_name, initials, city, region, country, avatar_seed, reliability, collab_count, onboarded_at, is_discoverable, lat, lng')
      .eq('id', session.user.id)
      .maybeSingle();

    if (error) throw error;
    if (!profile) { location.href = ONBOARDING_URL; return; }
    if (!profile.onboarded_at) { location.href = ONBOARDING_URL; return; }

    state.me = profile;
    paintSidebar(profile);

    try {
      const { data: saved } = await supabase.rpc('my_saves');
      state.savedIds = new Set(saved || []);
    } catch(e){ console.warn('my_saves:', e); }
    updateSavedBadge();

    try {
      const { data: followed } = await supabase.rpc('my_following_ids');
      state.followedIds = new Set(followed || []);
    } catch(e){ console.warn('my_following_ids:', e); }

    $('#bootText').textContent = 'Ranking creators near you…';
    await loadFeed();

    loadPosts().catch(e => console.warn('posts:', e));
    loadConversations().catch(e => console.warn('convos:', e));
    loadCollabs().catch(e => console.warn('collabs:', e));
    loadNotifications().catch(e => console.warn('notifs:', e));

    $('#bootScreen').classList.add('is-hidden');
    setTimeout(() => { $('#bootScreen').style.display = 'none'; }, 420);
    $('#app').style.display = '';
    $('#tabbar').style.display = '';

    const params = new URLSearchParams(location.search);
    const qv = params.get('v');
    const qu = params.get('u');

    if (qu) {
      setTimeout(async () => {
        try { await openCreator(qu); } catch(e){ console.warn('openCreator from URL:', e); }
      }, 200);
    }

    if (qv && VIEW_META[qv]) {
      navigate(qv);
    } else {
      navigate('home');
    }

    if (qv || qu) {
      try { history.replaceState(null, '', location.pathname); } catch(e){}
    }
  } catch(err){
    console.error('[TIMCRENET boot]', err);
    const msg = err?.message || String(err);
    let friendly = msg;
    if (msg.includes('match_feed') || (msg.includes('function') && msg.includes('does not exist')))
      friendly = 'A backend function is missing. Run the SQL scripts (app_fix, messaging, posts_follows, final) in Supabase.';
    fatal('Could not start TIMCRENET',
      `<p>${esc(friendly)}</p>
       <p style="font-size:12px;color:var(--text-3)">Full: <code>${esc(msg.slice(0,200))}</code></p>`,
      `<button class="btn" onclick="location.reload()">Reload</button>
       <button class="btn" onclick="location.href='index.html'">Sign out</button>`);
  }
})();

function paintSidebar(profile){
  const el = $('#meAvatarSide');
  el.style.cssText = avatarStyle(profile.avatar_seed || profile.handle);
  el.textContent = profile.initials || (profile.display_name?.[0] || '·').toUpperCase();
  $('#meNameSide').textContent = profile.display_name;
  $('#meMetaSide').textContent = [profile.city, profile.region].filter(Boolean).join(', ') || '—';
  $('#meRelSide').textContent = Number(profile.reliability ?? 5).toFixed(1);
}
function updateSavedBadge(){ $('#savedBadge').textContent = state.savedIds.size; }
function updatePostsBadge(){ $('#postsBadge').textContent = state.posts.length; }

async function loadFeed(){
  const { data, error } = await supabase.rpc('match_feed', {
    viewer: state.me.id, max_km: state.maxKm, min_score: 0, lim: 60
  });
  if (error) throw error;
  state.feed = data || [];
}

/* ─── nav ─────────────────────────────────────────────────────────────── */
function navigate(view){
  state.view = view;
  $$('.view').forEach(v => v.classList.remove('is-active'));
  const el = $('#view-' + view);
  if (el) el.classList.add('is-active');
  $$('[data-nav]').forEach(b => b.classList.toggle('is-active', b.dataset.nav === view));
  const meta = VIEW_META[view] || VIEW_META.home;
  $('#viewTitle').textContent = meta.title;
  $('#viewSub').textContent = meta.sub;
  $('#globalSearchWrap').style.display = (view === 'home' || view === 'explore') ? 'flex' : 'none';
  render();
}

function render(){
  switch(state.view){
    case 'home':          return renderHome();
    case 'posts':         return renderPosts();
    case 'explore':       return renderExplore();
    case 'map':           return renderMap();
    case 'saved':         return renderSaved();
    case 'messages':      return renderMessages();
    case 'collabs':       return renderCollabs();
    case 'notifications': return renderNotifications();
    case 'profile':       return renderProfile();
    case 'settings':      return renderSettings();
  }
}

/* ─── shared card components ──────────────────────────────────────────── */
function reasonChips(c){
  const out = [];
  if ((c.proximity??0)>=80 && c.distance_km!=null) out.push(`${c.distance_km.toFixed(1)} km away`);
  if ((c.equipment??0)>=85) out.push('Gear you need');
  if ((c.complementary??0)>=85) out.push('Skills that fit');
  if ((c.space??0)>=85) out.push('Space you can use');
  if ((c.availability??0)>=85) out.push('Schedule overlap');
  if ((c.niche??0)>=88) out.push('Same niche');
  return out.slice(0,4);
}

          ? posts.map(postCard).join('')
          : `<div class="empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16v11H7l-3 3z"/></svg>
              <h3>${state.postScope==='following' ? 'No posts from creators you follow' : 'No posts yet'}</h3>

                ? 'Follow more creators, or tap "Everyone" to see the global feed.'
                : 'Be the first to share something — tap "Write a post" above.'}</p>
            </div>`}
      </div>
    </div>`;

  const nb = $('#newPostBtn');
  if (nb) nb.addEventListener('click', openPostComposer);

  const rb = $('#refreshPostsBtn');
  if (rb) rb.addEventListener('click', async () => {
    rb.classList.add('is-loading'); rb.disabled = true;
    try {
      await loadPosts();
      renderPosts();
      toast('Posts refreshed');
    } catch(err){ toast(err.message || 'Refresh failed', 'err'); }
    finally { rb.classList.remove('is-loading'); rb.disabled = false; }
  });

  $$('[data-post-scope]').forEach(el => {
    el.addEventListener('click', async () => {
      if (state.postScope === el.dataset.postScope) return;
      state.postScope = el.dataset.postScope;
      try { await loadPosts(); renderPosts(); }
      catch(err){ toast(err.message, 'err'); }
    });
  });

function openPostComposer(){
  openSheet('Write a post', `
    <div class="field" style="margin-bottom:16px;max-width:none">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px">Title <span style="color:var(--text-3);font-weight:500">— optional</span></label>
      <input id="postTitle" type="text" placeholder="A headline…" maxlength="140"
        style="width:100%;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14.5px;color:var(--text)"/>
    </div>
    <div class="field" style="margin-bottom:16px;max-width:none">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px">Body</label>
      <textarea id="postBody" rows="8" placeholder="What do you want to share?" maxlength="4000"
        style="width:100%;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14.5px;color:var(--text);resize:vertical;font-family:inherit"></textarea>
      <div style="font-size:11.5px;color:var(--text-3);margin-top:6px" id="postCount">0 / 4000</div>
    </div>
    <p style="font-size:12.5px;color:var(--text-3);line-height:1.55">Text-only — no images or video. Visible to every creator who can see your profile.</p>
  `, `
    <button class="btn" id="postCancel" type="button">Cancel</button>
    <button class="btn btn-primary" id="postSubmit" type="button">Publish</button>`);

  const ta = $('#postBody');
  ta.addEventListener('input', () => {
    $('#postCount').textContent = ta.value.length + ' / 4000';
  });
  setTimeout(() => ta.focus(), 60);

  $('#postCancel').addEventListener('click', closeSheet);

  $('#postSubmit').addEventListener('click', async () => {
    const title = $('#postTitle').value.trim();
    const body = ta.value.trim();
    if (body.length < 1) return toast('Write something first', 'err');

    const btn = $('#postSubmit');
    btn.classList.add('is-loading'); btn.disabled = true;
    try {
      const { error } = await supabase.rpc('create_post', { p_title: title || null, p_body: body });
      if (error) throw error;
      toast('Posted');
      closeSheet();
      state.postScope = 'all';
      await loadPosts();
      if (state.view === 'posts') renderPosts();
    } catch(err){
      const msg = err?.message || String(err);
      if (msg.includes('body_required')) toast('Write something first', 'err');
      else if (msg.includes('body_too_long')) toast('Too long (max 4000)', 'err');
      else if (msg.includes('title_too_long')) toast('Title too long (max 140)', 'err');
      else toast(msg, 'err');
    } finally {
      btn.classList.remove('is-loading'); btn.disabled = false;
    }
  });
}

async function loadConversations(){
  const { data, error } = await supabase.rpc('my_conversations');
  if (error) throw error;
  state.conversations = data || [];
  updateMessagesBadge();
  if (state.view === 'messages') renderMessages();
}

function updateMessagesBadge(){
  const total = state.conversations.reduce((sum, c) => sum + (c.unread_count || 0), 0);
  ['#messagesBadge', '#tabMsgBadge'].forEach(sel => {
    const el = $(sel);
    if (!el) return;
    if (total > 0) { el.style.display = ''; el.textContent = total > 99 ? '99+' : total; }
    else el.style.display = 'none';
  });
}

function convDisplay(c){
  if (c.kind === 'group') return { name: c.name || 'Group', initials: (c.name||'G').slice(0,2).toUpperCase() };
  return {
    name: c.other_display_name || 'Unknown',
    initials: c.other_initials || '??',
    avatar_seed: c.other_avatar_seed || c.other_handle
  };
}

function wireChatPane(convo){
  const ta = $('#msgInput');
  if (ta) {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  }
  const send = $('#sendBtn');
  if (send) send.addEventListener('click', sendMessage);
  const back = $('[data-back-to-list]');
  if (back) back.addEventListener('click', () => {
    // Tear down the subscription when leaving the thread
    if (state.messageChannel) {
      try { supabase.removeChannel(state.messageChannel); } catch(e){}
      state.messageChannel = null;
    }
    state.subscribedConvId = null;
    state.mobileShowThread = false;
    state.activeConvId = null;
    renderMessages();

async function loadMessages(convId){
  const { data, error } = await supabase.rpc('conversation_messages', { p_conv: convId, p_lim: 200 });
  if (error) throw error;
  state.activeMessages = data || [];
  paintMessages();
  await supabase.rpc('mark_conversation_read', { p_conv: convId }).catch(()=>{});
  const c = state.conversations.find(x => x.conversation_id === convId);
  if (c) { c.unread_count = 0; updateMessagesBadge(); }
  subscribeToConversation(convId);
}

function paintMessages(){
  const list = $('#msgList');
  if (!list) return;
  const msgs = state.activeMessages;
  if (!msgs.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-3);font-size:13px">No messages yet — say hi!</div>`;
    return;
  }
  let lastDay = '';
  let lastSender = null;
  list.innerHTML = msgs.map((m) => {
    const isMe = m.sender_id === state.me.id;
    const day = dayKey(m.created_at);
    const daySep = day !== lastDay ? `<div class="day-sep">${esc(dayLabel(m.created_at))}</div>` : '';
    lastDay = day;
    const first = lastSender !== m.sender_id;
    lastSender = m.sender_id;
    const avatar = !isMe && first
      ? avatarHTML(m.sender_avatar_seed || m.sender_handle, m.sender_initials, 'xs')
      : (!isMe ? '<div style="width:30px;flex:none"></div>' : '');
    return `${daySep}
      <div class="msg ${isMe?'me':''} ${first?'first':''}">
        ${avatar}
        <div class="msg-col">
          <div class="bubble">${esc(m.body)}</div>
          <div class="msg-meta"><span>${esc(timeShort(m.created_at))}</span>${isMe?'<span>✓</span>':''}</div>
        </div>
      </div>`;
  }).join('');
}

async function scrollChatToBottom(){
  const list = $('#msgList');
  if (list) list.scrollTop = list.scrollHeight;
}

/* ── FIX: only tear down when actually switching conversations ── */
async function openConversation(convId){
  // If we're switching conversations, tear down the old channel first
  if (state.subscribedConvId && state.subscribedConvId !== convId) {
    if (state.messageChannel) {
      try { await supabase.removeChannel(state.messageChannel); } catch(e){}
      state.messageChannel = null;
    }
    state.subscribedConvId = null;
  }
  state.activeConvId = convId;
  state.mobileShowThread = true;
  renderMessages();
}

/* ── FIX: guard against duplicate subscriptions ── */
function subscribeToConversation(convId){
  // If we're already subscribed to this exact conversation, do nothing.
  if (state.subscribedConvId === convId && state.messageChannel) return;

  // Clean up any previous channel first
  if (state.messageChannel) {
    try { supabase.removeChannel(state.messageChannel); } catch(e){}
    state.messageChannel = null;
  }

  state.subscribedConvId = convId;

  // Unique channel name so Supabase never merges with a stale one
  const channelName = 'msg-' + convId + '-' + Math.random().toString(36).slice(2, 8);

  state.messageChannel = supabase
    .channel(channelName)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `conversation_id=eq.${convId}`
    }, async (payload) => {
      const m = payload.new;

      // Ignore our own messages — we already showed them optimistically
      if (m.sender_id === state.me.id) return;

      // Ignore messages for a conversation the user has navigated away from
      if (state.activeConvId !== convId) return;

      // Deduplicate — never push the same message twice
      if (state.activeMessages.some(x => x.id === m.id)) return;

      const { data: prof } = await supabase
        .from('profiles')
        .select('handle, display_name, initials, avatar_seed')
        .eq('id', m.sender_id)
        .maybeSingle();

      state.activeMessages.push({
        id: m.id,
        sender_id: m.sender_id,
        sender_handle: prof?.handle || '',
        sender_display_name: prof?.display_name || '',
        sender_initials: prof?.initials || '',
        sender_avatar_seed: prof?.avatar_seed || prof?.handle || '',
        body: m.body,
        kind: m.kind,
        created_at: m.created_at
      });
      paintMessages();
      await scrollChatToBottom();

      // Debounced refresh — prevents the sidebar from thrashing on rapid bursts
      scheduleConversationsRefresh();
    })
    .subscribe();
}

/* Global debouncer so bursts of incoming messages only trigger one refresh */
let _convRefreshTimer = null;
function scheduleConversationsRefresh(){
  clearTimeout(_convRefreshTimer);
  _convRefreshTimer = setTimeout(() => {
    loadConversations().catch(()=>{});
  }, 500);
}

async function sendMessage(){
  const ta = $('#msgInput');
  if (!ta) return;
  const body = ta.value.trim();
  if (!body) return;
  if (!state.activeConvId) return;

  ta.value = '';
  ta.style.height = 'auto';

  const optimistic = {
    id: 'temp-' + Date.now(),
    sender_id: state.me.id,
    sender_handle: state.me.handle,
    sender_display_name: state.me.display_name,
    sender_initials: state.me.initials || '',
    sender_avatar_seed: state.me.avatar_seed || state.me.handle,
    body, kind: 'text', created_at: new Date().toISOString()
  };
  state.activeMessages.push(optimistic);
  paintMessages();
  await scrollChatToBottom();

  const { error } = await supabase.from('messages').insert({
    conversation_id: state.activeConvId,
    sender_id: state.me.id,
    body,
    kind: 'text'
  });

  if (error) {
    toast(error.message || 'Send failed', 'err');
    state.activeMessages = state.activeMessages.filter(m => m.id !== optimistic.id);
    paintMessages();
    return;
  }
  scheduleConversationsRefresh();
}

async function openCollabSheet(id){
  const k = state.collabs.find(c => c.id === id);
  if (!k) return;
  openSheet(k.title, collabBody(k), `
    <button class="btn btn-primary" id="collabChatBtn" type="button">Open chat</button>
    <button class="btn" id="collabAdvance" type="button">Advance</button>
  `);

  const adv = $('#collabAdvance');
  if (adv) adv.addEventListener('click', async () => {
    const nextProgress = Math.min(100, (k.progress||0) + 25);
    const nextStatus = nextProgress >= 100 ? 'completed' : (k.status === 'proposed' ? 'active' : k.status);
    const { error } = await supabase.rpc('update_collab', {
      p_id: k.id, p_progress: nextProgress, p_status: nextStatus,
      p_next_step: null, p_agreement: null
    });
    if (error) return toast(error.message, 'err');
    toast('Progress updated');
    await loadCollabs();
    closeSheet();
  });

  const chat = $('#collabChatBtn');
  if (chat) chat.addEventListener('click', async () => {
    closeSheet();
    const partner = (k.participants || []).find(p => p.id !== state.me.id);
    if (!partner) return toast('No partner to chat with', 'err');
    await startDM(partner.id);
  });
}

function updateNotifBadge(){
  const n = state.notifications.filter(x => !x.read).length;
  const el = $('#notifBadge');
  if (!el) return;
  if (n > 0) { el.style.display = ''; el.textContent = n > 99 ? '99+' : n; }

function notifIcon(kind){
  const map = {
    message: { svg:'<path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4c-1.4 0-2.8-.3-4-1l-5.6 1.6 1.7-5.4A8.4 8.4 0 1 1 21 11.5Z"/>', bg:'var(--accent-soft)', fg:'var(--accent)' },
    collab:  { svg:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="8" r="2.6"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M15 14.5a5 5 0 0 1 6.5 5"/>', bg:'var(--success-soft)', fg:'var(--success)' },
    match:   { svg:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', bg:'var(--primary-soft)', fg:'var(--primary)' },
    system:  { svg:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>', bg:'var(--surface-2)', fg:'var(--text-2)' }
  };
  return map[kind] || map.system;
}

function renderNotifications(){
  const list = state.notifications;
  $('#view-notifications').innerHTML = `
    <div class="section">
      <div class="section-head">
        <h2>Activity</h2>
        <span class="count">${list.length}</span>
        <div class="spacer"></div>
        ${list.some(n=>!n.read)?`<button class="btn sm" id="markAllRead" type="button">Mark all read</button>`:''}
      </div>
      ${list.length ? list.map(n => {
        const ic = notifIcon(n.kind);
        return `<div class="notif ${!n.read?'unread':''}" data-notif="${esc(n.id)}" data-link-kind="${esc(n.link_kind||'')}" data-link-id="${esc(n.link_id||'')}">
          <div class="icon" style="background:${ic.bg};color:${ic.fg}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${ic.svg}</svg>
          </div>
          <div class="body">
            <p><b>${esc(n.title)}</b>${n.body?`<br>${esc(n.body)}`:''}</p>
            <time>${esc(timeAgo(n.created_at))}</time>
          </div>
        </div>`;
      }).join('') : `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8.5a6 6 0 1 0-12 0c0 7-2.5 8.5-2.5 8.5h17S18 15.5 18 8.5"/></svg>
        <h3>Nothing yet</h3>
        <p>Matches, messages, and collab invites will show up here.</p>
      </div>`}
    </div>`;

  const mark = $('#markAllRead');
  if (mark) mark.addEventListener('click', async () => {
    const { error } = await supabase.rpc('mark_notifications_read');
    if (error) return toast(error.message, 'err');
    state.notifications.forEach(n => n.read = true);
    renderNotifications();
    updateNotifBadge();
    toast('All caught up');

  $$('[data-notif]').forEach(el => el.addEventListener('click', async () => {
