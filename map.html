<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0B0F" id="metaThemeColor" />
<title>Nearby map — TIMCRENET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0A0B0F; --bg-elev:#0F1117; --surface:#14161E; --surface-2:#1B1E28; --surface-3:#242833;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
  --text:#F0F1F5; --text-2:#9698A6; --text-3:#5D5F70;
  --primary:#FF6B3D; --primary-soft:rgba(255,107,61,.14); --primary-glow:rgba(255,107,61,.4);
  --accent:#7C6BFF; --accent-soft:rgba(124,107,255,.14);
  --success:#3DD68C; --success-soft:rgba(61,214,140,.13);
  --warning:#FFB547;
  --danger:#FF5A6E; --danger-soft:rgba(255,90,110,.13);
  --radius-md:14px; --radius-lg:20px; --radius-full:999px;
  --grad-primary:linear-gradient(135deg,#FF6B3D 0%,#FF8F5C 40%,#FFB347 100%);
  --grad-warm:linear-gradient(135deg,#FF6B3D 0%,#FF4D8F 100%);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FAF9F7; --bg-elev:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F3F0; --surface-3:#EDEAE5;
  --border:rgba(20,15,10,.08); --border-strong:rgba(20,15,10,.15);
  --text:#0F0F12; --text-2:#5B5A66; --text-3:#8E8C99;
  --primary:#E5552A; --primary-soft:rgba(229,85,42,.1); --primary-glow:rgba(229,85,42,.3);
  --accent:#6A54F0; --accent-soft:rgba(106,84,240,.1);
  --success:#119F68; --success-soft:rgba(17,159,104,.11);
  --warning:#C28A0E; --danger:#DC2F45; --danger-soft:rgba(220,47,69,.1);
  --grad-primary:linear-gradient(135deg,#E5552A 0%,#F0703F 40%,#D18B1F 100%);
  --grad-warm:linear-gradient(135deg,#E5552A 0%,#D93D7A 100%);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  font-size:15px; line-height:1.5; letter-spacing:-.005em;
  transition:background .3s ease,color .3s ease;
}
button,input{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--primary);color:#fff}

.shell{display:grid;grid-template-columns:340px 1fr;height:100dvh}

/* ── sidebar list ── */
.list-pane{
  background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.lp-head{
  flex:none;padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.lp-head .back{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:background .16s;
}
.lp-head .back:hover{background:var(--surface-2);color:var(--text)}
.lp-head .back svg{width:18px;height:18px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.lp-title{flex:1;min-width:0}
.lp-title h1{font-size:16px;font-weight:800;letter-spacing:-.3px}
.lp-title p{font-size:12px;color:var(--text-3);font-weight:500}

.lp-controls{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.lp-radius{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.lp-radius input{flex:1;accent-color:var(--primary)}
.lp-radius b{color:var(--text);font-weight:800;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.lp-search{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-full);padding:8px 14px;
}
.lp-search svg{width:15px;height:15px;color:var(--text-3);flex:none;stroke-width:2.2;fill:none}
.lp-search input{flex:1;font-size:13px;font-weight:500}
.lp-search input::placeholder{color:var(--text-3)}

.lp-scroll{flex:1;overflow-y:auto;padding:8px}
.person-row{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:14px;cursor:pointer;
  transition:background .16s;border:1px solid transparent;
}
.person-row:hover{background:var(--surface-2);border-color:var(--border)}
.person-row .info{flex:1;min-width:0}
.person-row .top{display:flex;align-items:baseline;gap:8px}
.person-row .top b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-row .top .dist{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700;flex:none}
.person-row .meta{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-row .score{
  width:44px;height:44px;border-radius:13px;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:800;
  color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.4);
  border:2.5px solid var(--bg-elev);
}

/* ── map pane ── */
.map-pane{position:relative}
#map{position:absolute;inset:0;background:#0D0E14}
[data-theme="light"] #map{background:#EFEDE9}
.leaflet-container{background:transparent!important;font-family:inherit!important}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(1.05)}
[data-theme="light"] .leaflet-tile-pane{filter:none}
.leaflet-control-attribution{
  background:rgba(10,11,15,.7)!important;color:#9698A6!important;
  font-size:10px!important;padding:2px 6px!important;
}
.leaflet-control-attribution a{color:#FF6B3D!important}
.leaflet-popup-content-wrapper{
  background:var(--surface)!important;color:var(--text)!important;
  border-radius:14px!important;box-shadow:0 20px 50px -20px rgba(0,0,0,.9)!important;
  border:1px solid var(--border-strong)!important;
}
.leaflet-popup-content{margin:14px 16px!important;font-size:13px!important}
.leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--border-strong)!important}
.leaflet-popup-close-button{color:var(--text-2)!important;font-size:18px!important;padding:6px!important}

.popup-inner{display:flex;flex-direction:column;gap:10px;min-width:200px}
.popup-head{display:flex;align-items:center;gap:10px}
.popup-avatar{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.4);
}
.popup-name{flex:1;min-width:0}
.popup-name b{display:block;font-size:13.5px;font-weight:700}
.popup-name span{display:block;font-size:11.5px;color:var(--text-3)}
.popup-meta{font-size:11.5px;color:var(--text-3)}
.popup-actions{display:flex;gap:8px;margin-top:4px}
.popup-btn{
  flex:1;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);
  transition:background .16s;text-align:center;
}
.popup-btn.primary{background:var(--grad-warm);border-color:transparent;color:#fff}

.marker-pin{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
  border:2.5px solid var(--bg);
  box-shadow:0 10px 22px -8px rgba(0,0,0,.85);
  text-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;
}
.marker-pin:hover{transform:scale(1.1)}
.me-pin{
  width:22px;height:22px;border-radius:50%;background:var(--primary);
  border:3px solid var(--bg-elev);
  box-shadow:0 0 0 6px var(--primary-soft),0 0 22px var(--primary-glow);
}

.map-legend{
  position:absolute;left:16px;bottom:16px;z-index:500;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px;
}
.legend-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2);font-weight:500}
.legend-swatch{width:12px;height:12px;border-radius:4px;flex:none}

.map-zoom{
  position:absolute;right:16px;top:16px;z-index:500;
  display:flex;flex-direction:column;gap:6px;
}
.zoom-btn{
  width:42px;height:42px;border-radius:11px;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);color:var(--text-2);
  display:grid;place-items:center;
  transition:background .16s,color .16s;
}
.zoom-btn:hover{background:var(--surface);color:var(--text)}
.zoom-btn svg{width:18px;height:18px;stroke-width:2.2;stroke-linecap:round;fill:none}

.toast-root{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  z-index:800;display:flex;flex-direction:column;gap:10px;align-items:center;
  pointer-events:none;max-width:calc(100vw - 32px);
}
.toast{
  background:var(--surface-3);border:1px solid var(--border-strong);
  color:var(--text);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.9);
  display:flex;align-items:center;gap:10px;animation:tIn .3s;
}
.toast svg{width:16px;height:16px;color:var(--success);flex:none;stroke-width:2.4;fill:none}
.toast.err svg{color:var(--danger)}
@keyframes tIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.loading{
  position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:var(--bg);
}
.loading.is-open{display:flex}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--text-3);font-weight:600}

.error-card{
  position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:32px;background:var(--bg);
}
.error-card.is-open{display:flex}
.ec-inner{max-width:520px;background:var(--surface);border:1px solid var(--danger);border-radius:20px;padding:28px}
.ec-inner h2{font-size:18px;font-weight:800;color:var(--danger);margin-bottom:10px}
.ec-inner p{font-size:13.5px;color:var(--text-2);line-height:1.6;margin-bottom:14px}
.ec-inner .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  margin-right:8px;transition:background .16s;
}
.ec-inner .btn:hover{background:var(--surface-2);color:var(--text)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .list-pane{
    position:absolute;top:0;left:0;bottom:0;width:min(85%,340px);z-index:400;
    transform:translateX(-102%);transition:transform .3s;
  }
  .list-pane.is-open{transform:translateX(0)}
  .map-pane .toggle-list{
    position:absolute;left:16px;top:16px;z-index:500;
    width:44px;height:44px;border-radius:12px;
    background:color-mix(in srgb,var(--surface) 96%,transparent);
    backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--text-2);
    display:grid;place-items:center;
  }
}
@media (min-width:821px){
  .map-pane .toggle-list{display:none}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Loading map…</p>
</div>

<div class="error-card" id="errorCard">
  <div class="ec-inner">
    <h2 id="errTitle">Something went wrong</h2>
    <p id="errBody"></p>
    <button class="btn" onclick="location.reload()">Reload</button>
    <button class="btn" onclick="location.href='app.html'">Back to app</button>
  </div>
</div>

<div class="shell">
  <aside class="list-pane" id="listPane">
    <div class="lp-head">
      <button class="back" onclick="location.href='app.html'" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="lp-title">
        <h1>Nearby</h1>
        <p id="countLabel">Loading…</p>
      </div>
    </div>
    <div class="lp-controls">
      <div class="lp-radius">
        <span>Radius</span>
        <input type="range" min="5" max="200" value="60" id="radiusSlider"/>
        <b id="radiusLabel">60 km</b>
      </div>
      <div class="lp-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="Search name, niche, city…"/>
      </div>
    </div>
    <div class="lp-scroll" id="listScroll"></div>
  </aside>

  <div class="map-pane">
    <button class="toggle-list" id="toggleList" aria-label="Toggle list" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:20px;height:20px;stroke-width:2;stroke-linecap:round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div id="map"></div>
    <div class="map-zoom">
      <button class="zoom-btn" id="zoomIn" aria-label="Zoom in" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="zoom-btn" id="zoomOut" aria-label="Zoom out" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg>
      </button>
      <button class="zoom-btn" id="zoomMe" aria-label="Center on me" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="map-legend">
      <div class="legend-row"><span class="legend-swatch" style="background:var(--success)"></span>88%+ fit</div>
      <div class="legend-row"><span class="legend-swatch" style="background:var(--warning)"></span>74–87% fit</div>
      <div class="legend-row"><span class="legend-swatch" style="background:var(--danger)"></span>Below 74%</div>
    </div>
  </div>
</div>

<div class="toast-root" id="toastRoot"></div>

<script type="module">
const SUPABASE_URL      = 'https://zwzryfzmfgkfwpxznypn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3enJ5ZnptZmdrZndweHpueXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzAwNjksImV4cCI6MjEwNjg0NjA2OX0.ShUxUIUhKNmWSxElZQXWJNTe4g2m_YtDRgjSPVWVWuo';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const sb = createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim(), {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'timcrenet.auth' }
});

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const hashStr = s => {let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const avatarStyle = seed => {
  const h = hashStr(String(seed||'x'));
  const a=h%360,b=(a+55+(h>>3)%110)%360,c=(a+210+(h>>7)%90)%360,ang=h%360;
  return `background:conic-gradient(from ${ang}deg,hsl(${a} 72% 58%),hsl(${b} 70% 54%),hsl(${c} 74% 60%),hsl(${a} 72% 58%));`;
};
const timeAgo = iso => {
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s<60) return 'now'; const m=Math.floor(s/60); if(m<60)return m+'m';
  const h=Math.floor(m/60); if(h<24)return h+'h'; return Math.floor(h/24)+'d';
};

function toast(txt, kind='ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':'');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${
    kind==='err'?'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>':'<path d="M20 6 9 17l-5-5"/>'
  }</svg><span>${esc(txt)}</span>`;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateY(12px)';setTimeout(()=>el.remove(),320)},2600);
}

function fatal(title, body) {
  $('#loading').classList.remove('is-open');
  $('#errTitle').textContent = title;
  $('#errBody').innerHTML = body;
  $('#errorCard').classList.add('is-open');
}

/* theme */
(function(){
  const t = localStorage.getItem('timcrenet-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme', t);
  $('#metaThemeColor').setAttribute('content', t==='light'?'#FAF9F7':'#0A0B0F');
})();

/* state */
const state = { me: null, creators: [], filtered: [], radius: 60, query: '', map: null, markers: [], meMarker: null };

/* boot */
(async function boot(){
  $('#loading').classList.add('is-open');
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }

    const { data: profile, error } = await sb.from('profiles')
      .select('id, display_name, city, region, lat, lng')
      .eq('id', session.user.id).maybeSingle();
    if (error) throw error;
    if (!profile || profile.lat == null) {
      fatal('Set your location first', '<p>We need your coordinates to show nearby creators. Re-run onboarding.</p><button class="btn" onclick="location.href=\'onboarding.html\'">Go to onboarding</button>');
      return;
    }
    state.me = profile;

    const { data: creators, error: e2 } = await sb.rpc('map_creators');
    if (e2) throw e2;
    state.creators = creators || [];

    initMap();
    applyFilters();
    $('#loading').classList.remove('is-open');
  } catch (err) {
    console.error(err);
    fatal('Could not load the map', `<p>${esc(err.message || err)}</p><p style="font-size:12px;color:var(--text-3)">If the map_creators function is missing, run timcrenet_final.sql in Supabase.</p>`);
  }
})();

function initMap(){
  const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([state.me.lat, state.me.lng], 10);
  state.map = map;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  L.marker([state.me.lat, state.me.lng], {
    icon: L.divIcon({ html: '<div class="me-pin"></div>', className: '', iconSize: [22,22], iconAnchor: [11,11] })
  }).addTo(map).bindPopup('<b>You are here</b><br><span style="color:var(--text-3);font-size:12px">' + esc(state.me.city || '') + '</span>');

  $('#zoomIn').addEventListener('click', () => map.zoomIn());
  $('#zoomOut').addEventListener('click', () => map.zoomOut());
  $('#zoomMe').addEventListener('click', () => map.setView([state.me.lat, state.me.lng], 12, { animate: true }));
  $('#toggleList').addEventListener('click', () => $('#listPane').classList.toggle('is-open'));
  map.on('click', () => $('#listPane').classList.remove('is-open'));

  // radius slider
  const slider = $('#radiusSlider');
  slider.value = state.radius;
  slider.addEventListener('input', e => {
    state.radius = Number(e.target.value);
    $('#radiusLabel').textContent = state.radius + ' km';
    applyFilters();
  });

  // search
  $('#searchInput').addEventListener('input', e => {
    state.query = e.target.value.trim().toLowerCase();
    applyFilters();
  });
}

function haversine(a, b, c, d){
  const R = 6371;
  const dLat = (c-a) * Math.PI/180, dLon = (d-b) * Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180) * Math.cos(c*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function applyFilters(){
  const out = state.creators.filter(c => {
    if (c.lat == null || c.lng == null) return false;
    const dist = haversine(state.me.lat, state.me.lng, c.lat, c.lng);
    c._dist = dist;
    if (dist > state.radius) return false;
    if (state.query) {
      const hay = [c.display_name, c.handle, c.city, c.region, c.country].join(' ').toLowerCase();
      if (!hay.includes(state.query)) return false;
    }
    return true;
  }).sort((a,b) => a._dist - b._dist);

  state.filtered = out;
  paintList();
  paintMarkers();
  $('#countLabel').textContent = `${out.length} creator${out.length===1?'':'s'} in ${state.radius} km`;
}

function scoreColor(score){
  return score >= 88 ? 'var(--success)' : score >= 74 ? 'var(--warning)' : 'var(--danger)';
}

function paintList(){
  const el = $('#listScroll');
  if (!state.filtered.length){
    el.innerHTML = `<div style="padding:32px 16px;text-align:center;color:var(--text-3);font-size:13px">
      <p style="margin-bottom:6px">No creators in range.</p>
      <p style="font-size:12px">Try widening the radius.</p>
    </div>`;
    return;
  }
  el.innerHTML = state.filtered.map(c => `
    <button class="person-row" data-id="${esc(c.id)}" type="button">
      <div class="score" style="${avatarStyle(c.avatar_seed||c.handle)}">${c.score}</div>
      <div class="info">
        <div class="top"><b>${esc(c.display_name)}</b><span class="dist">${c._dist.toFixed(1)} km</span></div>
        <div class="meta">@${esc(c.handle)} · ${esc(c.city||c.region||'—')}</div>
      </div>
    </button>`).join('');
  $$('.person-row').forEach(el => el.addEventListener('click', () => focusCreator(el.dataset.id)));
}

function paintMarkers(){
  state.markers.forEach(m => state.map.removeLayer(m));
  state.markers = [];

  state.filtered.forEach(c => {
    const color = scoreColor(c.score);
    const html = `<div class="marker-pin" style="${avatarStyle(c.avatar_seed||c.handle)};box-shadow:0 0 0 3px ${color}, 0 10px 22px -8px rgba(0,0,0,.85)">${esc(c.initials||'·')}</div>`;
    const icon = L.divIcon({ html, className: '', iconSize: [38,38], iconAnchor: [19,19] });

    const marker = L.marker([c.lat, c.lng], { icon })
      .addTo(state.map)
      .bindPopup(popupHTML(c), { closeButton: true, offset: [0,-18] });

    marker.on('popupopen', () => {
      const pop = marker.getPopup().getElement();
      pop.querySelector('[data-action="message"]')?.addEventListener('click', () => {
        sb.rpc('find_or_create_dm', { other_user: c.id }).then(({error}) => {
          if (error) return toast(error.message, 'err');
          location.href = 'app.html?v=messages';
        });
      });
      pop.querySelector('[data-action="view"]')?.addEventListener('click', () => {
        location.href = 'app.html?v=profile&u=' + c.id;
      });
    });

    state.markers.push(marker);
  });
}

function popupHTML(c){
  return `<div class="popup-inner">
    <div class="popup-head">
      <div class="popup-avatar" style="${avatarStyle(c.avatar_seed||c.handle)}">${esc(c.initials||'·')}</div>
      <div class="popup-name">
        <b>${esc(c.display_name)}</b>
        <span>@${esc(c.handle)}</span>
      </div>
    </div>
    <div class="popup-meta">
      ${c._dist.toFixed(1)} km away · ${esc(c.city||'')}${c.region?', '+esc(c.region):''}<br>
      Match: <b style="color:${scoreColor(c.score)}">${c.score}%</b>
    </div>
    <div class="popup-actions">
      <button class="popup-btn primary" data-action="view" type="button">View profile</button>
      <button class="popup-btn" data-action="message" type="button">Say hi</button>
    </div>
  </div>`;
}

function focusCreator(id){
  const c = state.filtered.find(x => x.id === id);
  if (!c) return;
  state.map.setView([c.lat, c.lng], 14, { animate: true });
  const m = state.markers.find(m => {
    const ll = m.getLatLng();
    return Math.abs(ll.lat - c.lat) < 0.0001 && Math.abs(ll.lng - c.lng) < 0.0001;
  });
  if (m) m.openPopup();
  $('#listPane').classList.remove('is-open');
}
</script>
</body>
</html>
