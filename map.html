<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0B0F" id="metaThemeColor" />
<title>Radar — TIMCRENET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F; --bg-elev:#0F1117; --surface:#14161E; --surface-2:#1B1E28; --surface-3:#242833;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
  --text:#F0F1F5; --text-2:#9698A6; --text-3:#5D5F70;
  --primary:#FF6B3D; --primary-soft:rgba(255,107,61,.14); --primary-glow:rgba(255,107,61,.4);
  --accent:#7C6BFF; --accent-soft:rgba(124,107,255,.14);
  --success:#3DD68C; --success-soft:rgba(61,214,140,.13);
  --warning:#FFB547; --danger:#FF5A6E; --danger-soft:rgba(255,90,110,.13);
  --radius-md:14px; --radius-lg:20px; --radius-full:999px;
  --grad-warm:linear-gradient(135deg,#FF6B3D 0%,#FF4D8F 100%);
  --sidebar-w:320px; --topbar-h:68px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FAF9F7; --bg-elev:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F3F0; --surface-3:#EDEAE5;
  --border:rgba(20,15,10,.08); --border-strong:rgba(20,15,10,.15);
  --text:#0F0F12; --text-2:#5B5A66; --text-3:#8E8C99;
  --primary:#E5552A; --primary-soft:rgba(229,85,42,.1); --primary-glow:rgba(229,85,42,.3);
  --accent:#6A54F0; --accent-soft:rgba(106,84,240,.1);
  --success:#119F68; --success-soft:rgba(17,159,104,.11);
  --warning:#C28A0E; --danger:#DC2F45; --danger-soft:rgba(220,47,69,.1);
  --grad-warm:linear-gradient(135deg,#E5552A 0%,#D93D7A 100%);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:15px; line-height:1.5; letter-spacing:-.005em;
  overflow:hidden; transition:background .3s ease,color .3s ease;
}
button,input{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ─── SHELL ─── */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100dvh;overflow:hidden}

/* ─── SIDEBAR ─── */
.radar-side{
  background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.rs-head{
  flex:none;padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.rs-back{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);transition:background .16s;
}
.rs-back:hover{background:var(--surface-2);color:var(--text)}
.rs-back svg{width:18px;height:18px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.rs-title{flex:1;min-width:0}
.rs-title h1{font-size:16px;font-weight:800;letter-spacing:-.3px}
.rs-title p{font-size:12px;color:var(--text-3);font-weight:500}

.rs-controls{
  flex:none;padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:12px;
}
.rs-radius{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.rs-radius input{flex:1;accent-color:var(--primary);min-width:0}
.rs-radius b{color:var(--text);font-weight:800;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.rs-search{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-full);padding:8px 14px;
}
.rs-search svg{width:15px;height:15px;color:var(--text-3);flex:none;stroke-width:2.2;fill:none}
.rs-search input{flex:1;font-size:13px;font-weight:500;min-width:0}
.rs-search input::placeholder{color:var(--text-3)}

.rs-stats{
  flex:none;padding:12px 20px;border-bottom:1px solid var(--border);
  display:flex;gap:20px;font-size:12px;color:var(--text-3);font-weight:600;
}
.rs-stats b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}

.rs-scroll{flex:1;overflow-y:auto;padding:8px}

.blip-row{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:14px;cursor:pointer;
  transition:background .16s;border:1px solid transparent;
  width:100%;text-align:left;
}
.blip-row:hover{background:var(--surface-2);border-color:var(--border)}
.blip-row.is-active{background:var(--primary-soft);border-color:var(--primary)}
.blip-score{
  width:44px;height:44px;border-radius:13px;flex:none;
  display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.4);
  border:2.5px solid var(--bg-elev);
}
.blip-info{flex:1;min-width:0}
.blip-info .top{display:flex;align-items:baseline;gap:8px}
.blip-info .top b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blip-info .top .dist{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700;flex:none}
.blip-info .meta{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.blip-info .bearing{color:var(--accent);font-weight:700}

/* ─── RADAR PANE ─── */
.radar-pane{
  position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 50%, #0d0f16 0%, #06070b 70%);
  display:flex;align-items:center;justify-content:center;
}
[data-theme="light"] .radar-pane{
  background:radial-gradient(circle at 50% 50%, #f8f6f2 0%, #ebe8e2 70%);
}

/* Top bar inside radar pane */
.rp-top{
  position:absolute;top:0;left:0;right:0;
  padding:16px 22px;
  display:flex;align-items:center;gap:14px;
  z-index:30;pointer-events:none;
}
.rp-top > *{pointer-events:auto}
.rp-brand{
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-2);
}
.rp-brand .live{
  width:7px;height:7px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 4px rgba(61,214,140,.15);
  animation:livePulse 2s infinite;
}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.rp-top .spacer{flex:1}
.rp-coords{
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--text-3);letter-spacing:.02em;
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  padding:7px 12px;border-radius:20px;
  border:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.rp-icon-btn{
  width:40px;height:40px;border-radius:11px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  backdrop-filter:blur(12px);
  color:var(--text-2);
  transition:background .16s,color .16s,transform .16s;
}
.rp-icon-btn:hover{background:var(--surface-2);color:var(--text);transform:scale(1.05)}
.rp-icon-btn:active{transform:scale(.94)}
.rp-icon-btn svg{width:18px;height:18px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* ─── RADAR ─── */
.radar-stage{
  position:relative;
  width:min(78vh, 78vw, 720px);
  aspect-ratio:1;
  display:grid;place-items:center;
}
.radar{
  position:relative;
  width:100%;height:100%;
  border-radius:50%;
  background:radial-gradient(circle at center, rgba(255,107,61,.04) 0%, rgba(255,107,61,.01) 40%, transparent 75%);
  box-shadow:
    inset 0 0 100px rgba(255,107,61,.06),
    inset 0 0 40px rgba(0,0,0,.4),
    0 0 0 1px rgba(255,107,61,.18),
    0 0 120px rgba(255,107,61,.08);
  overflow:hidden;
  animation:radarPulse 4s ease-in-out infinite;
}
@keyframes radarPulse{0%,100%{box-shadow:inset 0 0 100px rgba(255,107,61,.06), inset 0 0 40px rgba(0,0,0,.4), 0 0 0 1px rgba(255,107,61,.18), 0 0 120px rgba(255,107,61,.08)}
50%{box-shadow:inset 0 0 100px rgba(255,107,61,.1), inset 0 0 40px rgba(0,0,0,.4), 0 0 0 1px rgba(255,107,61,.25), 0 0 140px rgba(255,107,61,.12)}}

/* Concentric rings */
.radar-rings{
  position:absolute;inset:0;
  border-radius:50%;overflow:hidden;
}
.radar-ring{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid rgba(255,107,61,.13);
  pointer-events:none;
}
[data-theme="light"] .radar-ring{border-color:rgba(229,85,42,.18)}
.radar-ring.r1{width:25%;height:25%;border-style:dashed;border-color:rgba(255,107,61,.08)}
.radar-ring.r2{width:50%;height:50%}
.radar-ring.r3{width:75%;height:75%}
.radar-ring.r4{width:100%;height:100%;border-color:rgba(255,107,61,.25)}

/* Ring distance labels */
.radar-label{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%, calc(-50% - var(--radius-half)));
  font-size:10px;font-weight:800;letter-spacing:.06em;
  color:rgba(255,107,61,.55);
  background:var(--bg-elev);
  padding:2px 7px;border-radius:20px;
  border:1px solid rgba(255,107,61,.2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  pointer-events:none;
  z-index:3;
}
[data-theme="light"] .radar-label{color:rgba(229,85,42,.75);border-color:rgba(229,85,42,.25)}

/* Grid spokes */
.radar-spokes{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;
  color:rgba(255,107,61,.09);
}
[data-theme="light"] .radar-spokes{color:rgba(229,85,42,.13)}

/* Sweep */
.radar-sweep{
  position:absolute;inset:0;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(255,107,61,.55) 0deg,
    rgba(255,107,61,.22) 18deg,
    rgba(255,107,61,.06) 55deg,
    transparent 90deg,
    transparent 360deg
  );
  animation:sweepRotate 5s linear infinite;
  pointer-events:none;
  z-index:2;
  mix-blend-mode:screen;
}
[data-theme="light"] .radar-sweep{
  background:conic-gradient(
    from 0deg,
    rgba(229,85,42,.35) 0deg,
    rgba(229,85,42,.14) 18deg,
    rgba(229,85,42,.04) 55deg,
    transparent 90deg,
    transparent 360deg
  );
  mix-blend-mode:multiply;
}
@keyframes sweepRotate{to{transform:rotate(360deg)}}

/* Center me pin */
.radar-me{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:16px;height:16px;border-radius:50%;
  background:var(--primary);
  border:3px solid var(--bg-elev);
  box-shadow:0 0 20px var(--primary-glow), 0 0 0 6px rgba(255,107,61,.15);
  z-index:8;pointer-events:none;
}
.radar-me::after{
  content:"";position:absolute;inset:-14px;border-radius:50%;
  border:1.5px solid rgba(255,107,61,.5);
  animation:mePulse 2.4s ease-out infinite;
}
.radar-me::before{
  content:"";position:absolute;inset:-14px;border-radius:50%;
  border:1.5px solid rgba(255,107,61,.5);
  animation:mePulse 2.4s ease-out infinite .8s;
}
@keyframes mePulse{
  0%{transform:scale(.6);opacity:.9}
  100%{transform:scale(2.4);opacity:0}
}

/* Blips */
.blips-layer{
  position:absolute;inset:0;
  z-index:5;
}
.radar-blip{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.4,0,.2,1);
  z-index:6;
}
.radar-blip:hover{transform:translate(-50%,-50%) scale(1.15);z-index:20}

.radar-blip-dot{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.45);
  border:2.5px solid var(--bg-elev);
  box-shadow:0 6px 20px -6px rgba(0,0,0,.85), 0 0 0 2px rgba(255,107,61,.2);
  position:relative;
  transition:box-shadow .2s;
}
.radar-blip-dot::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.4), transparent 60%);
  mix-blend-mode:overlay;
}
.radar-blip:hover .radar-blip-dot{
  box-shadow:0 10px 28px -8px rgba(0,0,0,.9), 0 0 0 3px var(--primary), 0 0 30px var(--primary-glow);
}

.radar-blip-tip{
  position:absolute;top:calc(100% + 8px);
  font-size:10.5px;font-weight:700;
  color:var(--text);
  background:var(--surface);
  padding:4px 10px;border-radius:20px;
  border:1px solid var(--border-strong);
  white-space:nowrap;
  opacity:0;transform:translateY(-4px);
  transition:opacity .18s, transform .18s;
  pointer-events:none;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.5);
}
.radar-blip:hover .radar-blip-tip{opacity:1;transform:translateY(0)}

.radar-blip.is-selected .radar-blip-dot{
  box-shadow:0 10px 28px -8px rgba(0,0,0,.9), 0 0 0 3px var(--primary), 0 0 40px var(--primary-glow);
}

/* Cardinal directions */
.compass{
  position:absolute;inset:-40px;
  pointer-events:none;
  font-size:11px;font-weight:800;letter-spacing:.15em;
  color:var(--text-3);
  z-index:4;
}
.compass span{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:var(--bg-elev);
  padding:2px 6px;border-radius:20px;
  border:1px solid var(--border);
}
.compass .n{transform:translate(-50%, calc(-50% - var(--half) - 18px))}
.compass .e{transform:translate(calc(-50% + var(--half) + 18px), -50%)}
.compass .s{transform:translate(-50%, calc(-50% + var(--half) + 18px))}
.compass .w{transform:translate(calc(-50% - var(--half) - 18px), -50%)}

/* ─── RADAR CONTROLS (bottom right) ─── */
.radar-controls{
  position:absolute;right:24px;bottom:24px;z-index:20;
  display:flex;flex-direction:column;gap:10px;
}
.rc-group{
  display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 30px -10px rgba(0,0,0,.7);
}
.rc-btn{
  width:44px;height:44px;
  display:grid;place-items:center;
  color:var(--text-2);
  transition:background .16s,color .16s;
}
.rc-btn:hover{background:var(--surface-2);color:var(--text)}
.rc-btn:active{background:var(--surface-3)}
.rc-btn svg{width:18px;height:18px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.rc-btn + .rc-btn{border-top:1px solid var(--border)}

/* ─── LEGEND ─── */
.radar-legend{
  position:absolute;left:24px;bottom:24px;z-index:20;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 15px;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:0 8px 30px -10px rgba(0,0,0,.7);
}
.leg-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2);font-weight:600}
.leg-swatch{width:12px;height:12px;border-radius:4px;flex:none}

/* ─── SELECTED CREATOR CARD ─── */
.selected-card{
  position:absolute;top:80px;right:24px;z-index:25;
  width:min(340px, calc(100% - 48px));
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
  opacity:0;transform:translateY(-8px) scale(.98);
  pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.selected-card.is-visible{opacity:1;transform:none;pointer-events:auto}
.sc-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sc-avatar{
  width:52px;height:52px;border-radius:16px;flex:none;
  display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:18px;
  text-shadow:0 1px 6px rgba(0,0,0,.4);
  position:relative;overflow:hidden;
}
.sc-avatar::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%);
  mix-blend-mode:overlay;
}
.sc-who{flex:1;min-width:0}
.sc-who b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-who span{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-close{
  width:32px;height:32px;border-radius:9px;flex:none;
  display:grid;place-items:center;
  color:var(--text-3);
  transition:background .16s,color .16s;
}
.sc-close:hover{background:var(--surface-2);color:var(--text)}
.sc-close svg{width:16px;height:16px;stroke-width:2.2;stroke-linecap:round;fill:none}

.sc-metrics{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  margin-bottom:14px;
  padding:12px;border-radius:12px;
  background:var(--surface-2);
  border:1px solid var(--border);
}
.sc-metric{text-align:center}
.sc-metric b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.sc-metric span{display:block;font-size:9.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.sc-metric.match b{color:var(--success)}
.sc-metric.bear b{color:var(--accent)}
.sc-metric.dist b{color:var(--primary)}

.sc-actions{display:flex;gap:8px}
.sc-actions .btn{
  flex:1;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 14px;border-radius:11px;font-size:12.5px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:all .16s;white-space:nowrap;
}
.sc-actions .btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.sc-actions .btn.primary{
  background:var(--grad-warm);border-color:transparent;color:#fff;
  box-shadow:0 10px 22px -12px var(--primary-glow);
}
.sc-actions .btn.primary:hover{filter:brightness(1.06)}
.sc-actions .btn svg{width:14px;height:14px;stroke-width:2.2;fill:none}

/* ─── TOAST ─── */
.toast-root{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  z-index:800;display:flex;flex-direction:column;gap:10px;align-items:center;
  pointer-events:none;max-width:calc(100vw - 32px);
}
.toast{
  background:var(--surface-3);border:1px solid var(--border-strong);
  color:var(--text);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
  display:flex;align-items:center;gap:10px;animation:tIn .3s;
}
.toast svg{width:16px;height:16px;color:var(--success);flex:none;stroke-width:2.4;fill:none}
.toast.err svg{color:var(--danger)}
@keyframes tIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ─── LOADING / ERROR ─── */
.loading{
  position:fixed;inset:0;z-index:600;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:var(--bg);
}
.loading.is-open{display:flex}
.spinner{
  width:38px;height:38px;border-radius:50%;
  border:3px solid var(--surface-3);border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--text-3);font-weight:600}

.error-card{
  position:fixed;inset:0;z-index:700;
  display:none;align-items:center;justify-content:center;padding:32px;background:var(--bg);
}
.error-card.is-open{display:flex}
.ec-inner{
  max-width:520px;background:var(--surface);
  border:1px solid var(--danger);border-radius:20px;padding:28px;
}
.ec-inner h2{font-size:18px;font-weight:800;color:var(--danger);margin-bottom:10px}
.ec-inner p{font-size:13.5px;color:var(--text-2);line-height:1.6;margin-bottom:14px}
.ec-inner .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  margin-right:8px;transition:background .16s;
}
.ec-inner .btn:hover{background:var(--surface-2);color:var(--text)}

/* ─── MOBILE ─── */
.toggle-list{display:none}

@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .radar-side{
    position:absolute;top:0;left:0;bottom:0;width:min(85%,320px);z-index:60;
    transform:translateX(-102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .radar-side.is-open{transform:translateX(0)}
  .toggle-list{
    display:grid;
    position:absolute;left:20px;bottom:24px;z-index:30;
    width:48px;height:48px;border-radius:14px;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(14px);
    border:1px solid var(--border);color:var(--text-2);
    place-items:center;
    box-shadow:0 8px 30px -10px rgba(0,0,0,.7);
  }
  .radar-legend{display:none}
  .radar-stage{width:min(92vw, 92vh)}
  .selected-card{top:auto;bottom:80px;right:16px;left:16px;width:auto}
  .rp-coords{font-size:10.5px;padding:6px 10px}
  .compass{inset:-28px}
}
@media (max-width:520px){
  .radar-controls{right:16px;bottom:88px}
  .rc-btn{width:40px;height:40px}
  .radar-blip-dot{width:34px;height:34px;border-radius:11px;font-size:11px}
  .radar-blip-tip{font-size:10px}
}
</style>
</head>
<body>

<!-- ─── LOADING ─── -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Calibrating radar…</p>
</div>

<!-- ─── ERROR ─── -->
<div class="error-card" id="errorCard">
  <div class="ec-inner">
    <h2 id="errTitle">Something went wrong</h2>
    <p id="errBody"></p>
    <button class="btn" onclick="location.reload()">Reload</button>
    <button class="btn" onclick="location.href='app.html'">Back to app</button>

</div>

<!-- ─── SHELL ─── -->
<div class="shell">

  <!-- ─── SIDEBAR ─── -->
  <aside class="radar-side" id="radarSide">
    <div class="rs-head">
      <button class="rs-back" onclick="location.href='app.html'" aria-label="Back">

      </button>
      <div class="rs-title">

    <div class="rs-scroll" id="listScroll"></div>
  </aside>

  <!-- ─── RADAR PANE ─── -->
  <main class="radar-pane" id="radarPane">

    <!-- Top bar -->
    <div class="rp-top">
      <div class="rp-brand">
        <span class="live"></span>
        <span>RADAR · LIVE</span>
      </div>
      <div class="spacer"></div>
      <div class="rp-coords" id="coordsBadge">—</div>
      <button class="rp-icon-btn" id="recenterBtn" aria-label="Recenter" title="Recenter">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="rp-icon-btn" id="refreshBtn" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="rp-icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">

          <div class="radar-ring r2"></div>
          <div class="radar-ring r3"></div>
          <div class="radar-ring r4"></div>
          <!-- Distance labels injected by JS -->
          <div id="ringLabels"></div>
        </div>

        <!-- Grid spokes -->
        <svg class="radar-spokes" viewBox="0 0 200 200" preserveAspectRatio="none">
          <line x1="100" y1="0" x2="100" y2="200" stroke="currentColor" stroke-width=".35"/>
          <line x1="0" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width=".35"/>
          <line x1="29.3" y1="29.3" x2="170.7" y2="170.7" stroke="currentColor" stroke-width=".25"/>
          <line x1="170.7" y1="29.3" x2="29.3" y2="170.7" stroke="currentColor" stroke-width=".25"/>
          <line x1="50" y1="13.4" x2="150" y2="186.6" stroke="currentColor" stroke-width=".15"/>
          <line x1="13.4" y1="50" x2="186.6" y2="150" stroke="currentColor" stroke-width=".15"/>
          <line x1="150" y1="13.4" x2="50" y2="186.6" stroke="currentColor" stroke-width=".15"/>
          <line x1="186.6" y1="50" x2="13.4" y2="150" stroke="currentColor" stroke-width=".15"/>
        </svg>

        <!-- Sweep -->
        <div class="radar-sweep"></div>

        <!-- Blips layer -->
        <div class="blips-layer" id="blipsLayer"></div>

        <!-- Me pin (on top) -->
        <div class="radar-me"></div>
      </div>

      <!-- Compass -->
      <div class="compass" id="compass">
        <span class="n">N</span>
        <span class="e">E</span>
        <span class="s">S</span>
        <span class="w">W</span>
      </div>
    </div>

    <!-- Controls (bottom right) -->
    <div class="radar-controls">
      <div class="rc-group">
        <button class="rc-btn" id="zoomIn" aria-label="Zoom in">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="rc-btn" id="zoomOut" aria-label="Zoom out">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <!-- Legend (bottom left) -->
    <div class="radar-legend">
      <div class="leg-row"><span class="leg-swatch" style="background:var(--success)"></span>88%+ match</div>
      <div class="leg-row"><span class="leg-swatch" style="background:var(--warning)"></span>74–87% match</div>
      <div class="leg-row"><span class="leg-swatch" style="background:var(--danger)"></span>Below 74%</div>
    </div>

    <!-- Toggle sidebar (mobile) -->
    <button class="toggle-list" id="toggleList" aria-label="Toggle list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:20px;height:20px;stroke-width:2;stroke-linecap:round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- Selected creator card -->
    <div class="selected-card" id="selectedCard"></div>
  </main>
</div>

<div class="toast-root" id="toastRoot"></div>

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   TIMCRENET · radar map
   Self-built radar display — no external map library.
   ══════════════════════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://zwzryfzmfgkfwpxznypn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3enJ5ZnptZmdrZndweHpueXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzAwNjksImV4cCI6MjEwNjg0NjA2OX0.ShUxUIUhKNmWSxElZQXWJNTe4g2m_YtDRgjSPVWVWuo';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const supabase = createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim(), {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'timcrenet.auth' }
});

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ─── THEME ───────────────────────────────────────────────────────────── */
(function initTheme(){
  const saved = localStorage.getItem('timcrenet-theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (prefersLight ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  $('#metaThemeColor').setAttribute('content', theme==='light' ? '#FAF9F7' : '#0A0B0F');
})();
$('#themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('timcrenet-theme', next);
  $('#metaThemeColor').setAttribute('content', next==='light' ? '#FAF9F7' : '#0A0B0F');
});

/* ─── HELPERS ─────────────────────────────────────────────────────────── */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function avatarStyle(seed){
  const h = hashStr(String(seed||'x'));
  const a=h%360,b=(a+55+(h>>3)%110)%360,c=(a+210+(h>>7)%90)%360,ang=h%360;
  return `background:conic-gradient(from ${ang}deg,hsl(${a} 72% 58%),hsl(${b} 70% 54%),hsl(${c} 74% 60%),hsl(${a} 72% 58%));`;
}
function timeAgo(iso){
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s<60) return 'just now';
  const m=Math.floor(s/60); if(m<60)return m+'m';
  const h=Math.floor(m/60); if(h<24)return h+'h';
  return Math.floor(h/24)+'d';
}
function toast(text, kind='ok'){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':'');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${
    kind==='err'?'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>':'<path d="M20 6 9 17l-5-5"/>'
  }</svg><span>${esc(text)}</span>`;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateY(12px)';setTimeout(()=>el.remove(),320)},2600);
}
function fatal(title, body){
  $('#loading').classList.remove('is-open');
  $('#errTitle').textContent = title;
  $('#errBody').innerHTML = body;
  $('#errorCard').classList.add('is-open');
}
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
function fmtBearing(deg){
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const i = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
  return `${dirs[i]} · ${Math.round(deg)}°`;
}
function fmtDistance(km){
  if (km < 1) return `${Math.round(km * 1000)} m`;
  if (km < 10) return `${km.toFixed(1)} km`;
  return `${Math.round(km)} km`;
}

/* ─── GEO MATH ────────────────────────────────────────────────────────── */
// Distance in km between two lat/lng points (haversine)
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// Bearing in degrees from point 1 to point 2 (0 = north, clockwise)
function bearing(lat1, lng1, lat2, lng2){
  const toRad = d => d * Math.PI / 180;
  const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

/* ─── STATE ───────────────────────────────────────────────────────────── */
const state = {
  me: null,
  creators: [],
  filtered: [],
  radius: 60,
  query: '',
  zoom: 1,                 // 1 = normal; up to 3 = zoom in
  selectedId: null,
  allLoaded: false
};

/* ─── SCORE COLOR ─────────────────────────────────────────────────────── */
function scoreColor(score){
  return score >= 88 ? 'var(--success)' : score >= 74 ? 'var(--warning)' : 'var(--danger)';
}

/* ─── BOOT ────────────────────────────────────────────────────────────── */
(async function boot(){
  $('#loading').classList.add('is-open');
  try {
    // 1 · session
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }

    // 2 · my profile (needs lat/lng)
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('id, handle, display_name, initials, avatar_seed, city, region, country, lat, lng')
      .eq('id', session.user.id)
      .maybeSingle();

    if (error) throw error;
    if (!profile) { location.href = 'onboarding.html'; return; }
    if (profile.lat == null || profile.lng == null){
      fatal(
        'Your location is missing',
        `<p>We need your coordinates to plot nearby creators. Re-run onboarding to set your city.</p>
         <button class="btn" onclick="location.href='onboarding.html'">Go to onboarding</button>
         <button class="btn" onclick="location.href='app.html'">Back to app</button>`
      );
      return;
    }

    state.me = profile;
    paintMeBadge(profile);

    // 3 · load creators
    await loadCreators();

    // 4 · ready
    $('#loading').classList.remove('is-open');
    renderRadar();
    renderList();
    layoutCompass();

    // Re-layout on resize
    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { renderRadar(); layoutCompass(); }, 120);
    });

  } catch(err){
    console.error('[radar boot]', err);
    const msg = err?.message || String(err);
    let friendly = msg;
    if (msg.includes('map_creators') || (msg.includes('function') && msg.includes('does not exist')))
      friendly = 'The <b>map_creators</b> function is missing. Run <code>timcrenet_map.sql</code> in Supabase.';
    fatal('Could not start the radar', `<p>${esc(friendly)}</p><p style="font-size:12px;color:var(--text-3)">Full: <code>${esc(msg.slice(0,200))}</code></p>`);
  }
})();

/* ─── LOAD CREATORS ───────────────────────────────────────────────────── */
async function loadCreators(){
  $('#loadingText').textContent = 'Scanning creators…';
  const { data, error } = await supabase.rpc('map_creators');
  if (error) throw error;

  // Compute distance + bearing, then keep only those inside the current radius
  const me = state.me;
  const enriched = (data || []).map(c => {
    const dist = haversine(me.lat, me.lng, c.lat, c.lng);
    const bear = bearing(me.lat, me.lng, c.lat, c.lng);
    return { ...c, _dist: dist, _bearing: bear };
  });

  state.creators = enriched;
  applyFilters();
  state.allLoaded = true;
}

function applyFilters(){
  const q = state.query.trim().toLowerCase();
  const me = state.me;

  const out = state.creators.filter(c => {
    if (c._dist > state.radius) return false;
    if (q) {
      const hay = [c.display_name, c.handle, c.city, c.region, c.country].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => a._dist - b._dist);

  state.filtered = out;

  $('#statInRange').textContent = out.length;
  $('#statTotal').textContent = state.creators.length;
  $('#statSelected').textContent = state.selectedId ? '1' : '—';
  $('#rsSubtitle').textContent = `${out.length} creator${out.length === 1 ? '' : 's'} on radar`;

  renderList();
  renderRadar();
}

/* ─── PAINT ME BADGE ──────────────────────────────────────────────────── */
function paintMeBadge(profile){
  const lat = profile.lat.toFixed(4);
  const lng = profile.lng.toFixed(4);
  $('#coordsBadge').textContent = `${lat}, ${lng}`;
}

/* ─── RING LABELS ─────────────────────────────────────────────────────── */
function updateRingLabels(radiusPx){
  const wrap = $('#ringLabels');
  const labelPx = [0.25, 0.5, 0.75, 1.0];
  wrap.innerHTML = labelPx.map(frac => {
    const distKm = Math.round(state.radius * frac);
    const yOffset = -Math.round(radiusPx * frac);
    return `<div class="radar-label" style="--radius-half:${Math.abs(yOffset)}px">${distKm} km</div>`;
  }).join('');
}

/* ─── RADAR RENDER ────────────────────────────────────────────────────── */
function renderRadar(){
  const stage = $('#radarStage');
  const radar = $('#radar');
  const blips = $('#blipsLayer');

  const w = radar.clientWidth;
  const h = radar.clientHeight;
  const cx = w / 2;
  const cy = h / 2;
  const baseRadius = Math.min(w, h) / 2 - 4;
  const radiusPx = baseRadius * state.zoom;

  updateRingLabels(baseRadius);

  blips.innerHTML = '';

  if (!state.filtered.length) return;

  const frag = document.createDocumentFragment();

  state.filtered.forEach(c => {
    // ratio of creator's distance to the current radius
    const ratio = clamp(c._dist / state.radius, 0, 1);
    // convert ratio to pixel distance on the radar (using zoom)
    const rPx = ratio * radiusPx;
    // bearing = 0 means North (up) → -cos; bearing = 90 means East → +sin
    const rad = c._bearing * Math.PI / 180;
    const dx = Math.sin(rad) * rPx;
    const dy = -Math.cos(rad) * rPx;

    const x = cx + dx;
    const y = cy + dy;

    // Clamp if it would go outside the visible radar
    const maxVisible = baseRadius - 22;
    const dist = Math.hypot(dx, dy);
    let fx = x, fy = y;
    if (dist > maxVisible) {
      const k = maxVisible / dist;
      fx = cx + dx * k;
      fy = cy + dy * k;
    }

    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'radar-blip' + (c.id === state.selectedId ? ' is-selected' : '');
    el.style.left = `${fx}px`;
    el.style.top = `${fy}px`;
    el.dataset.id = c.id;

    const scoreCol = scoreColor(c.score);
    el.innerHTML = `
      <span class="radar-blip-dot" style="${avatarStyle(c.avatar_seed || c.handle)};box-shadow:0 6px 20px -6px rgba(0,0,0,.85), 0 0 0 2px ${scoreCol}">
        ${esc(c.initials || '·')}
      </span>
      <span class="radar-blip-tip">${esc(c.display_name.split(' ')[0])} · ${c.score}%</span>
    `;

    el.addEventListener('click', () => selectCreator(c.id));
    frag.appendChild(el);
  });

  blips.appendChild(frag);
}

/* ─── COMPASS LAYOUT ──────────────────────────────────────────────────── */
function layoutCompass(){
  const stage = $('#radarStage');
  const compass = $('#compass');
  if (!stage || !compass) return;
  const half = stage.clientWidth / 2;
  compass.style.setProperty('--half', `${half}px`);
}

/* ─── LIST RENDER ─────────────────────────────────────────────────────── */
function renderList(){
  const wrap = $('#listScroll');
  if (!state.filtered.length){
    wrap.innerHTML = `<div style="padding:32px 16px;text-align:center;color:var(--text-3);font-size:13px">
      <p style="margin-bottom:6px">No creators in range.</p>
      <p style="font-size:12px">Try widening the radius or clearing the filter.</p>
    </div>`;
    return;
  }

  wrap.innerHTML = state.filtered.map(c => {
    const scoreCol = scoreColor(c.score);
    return `
      <button type="button" class="blip-row ${c.id === state.selectedId ? 'is-active' : ''}" data-id="${esc(c.id)}">
        <span class="blip-score" style="${avatarStyle(c.avatar_seed || c.handle)};box-shadow:0 0 0 2px ${scoreCol}">${c.score}</span>
        <span class="blip-info">
          <span class="top">
            <b>${esc(c.display_name)}</b>
            <span class="dist">${fmtDistance(c._dist)}</span>
          </span>
          <span class="meta">@${esc(c.handle)} · <span class="bearing">${fmtBearing(c._bearing)}</span></span>
        </span>
      </button>`;
  }).join('');

  $$('.blip-row').forEach(el => el.addEventListener('click', () => selectCreator(el.dataset.id)));
}

/* ─── SELECT CREATOR ──────────────────────────────────────────────────── */
function selectCreator(id){
  if (state.selectedId === id) { deselect(); return; }
  state.selectedId = id;

  // highlight in list
  $$('.blip-row').forEach(el => el.classList.toggle('is-active', el.dataset.id === id));
  $$('.radar-blip').forEach(el => el.classList.toggle('is-selected', el.dataset.id === id));
  $('#statSelected').textContent = '1';

  // Show floating card
  const c = state.creators.find(x => x.id === id);
  if (!c) return;
  showSelectedCard(c);
}

function deselect(){
  state.selectedId = null;
  $$('.blip-row').forEach(el => el.classList.remove('is-active'));
  $$('.radar-blip').forEach(el => el.classList.remove('is-selected'));
  $('#statSelected').textContent = '—';
  hideSelectedCard();
}

function showSelectedCard(c){
  const scoreCol = scoreColor(c.score);
  const card = $('#selectedCard');
  card.innerHTML = `
    <div class="sc-head">
      <div class="sc-avatar" style="${avatarStyle(c.avatar_seed || c.handle)}">${esc(c.initials || '·')}</div>
      <div class="sc-who">
        <b>${esc(c.display_name)}</b>
        <span>@${esc(c.handle)}${c.city ? ' · ' + esc(c.city) : ''}</span>
      </div>
      <button class="sc-close" aria-label="Close" id="cardClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sc-metrics">
      <div class="sc-metric match"><b>${c.score}%</b><span>Match</span></div>
      <div class="sc-metric bear"><b>${Math.round(c._bearing)}°</b><span>Bearing</span></div>
      <div class="sc-metric dist"><b>${fmtDistance(c._dist)}</b><span>Distance</span></div>
    </div>
    <div class="sc-actions">
      <button class="btn primary" id="cardMessage" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4c-1.4 0-2.8-.3-4-1l-5.6 1.6 1.7-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg>
        Say hi
      </button>
      <button class="btn" id="cardFollow" type="button">
        ${c.is_following ? 'Following' : 'Follow'}
      </button>
    </div>
  `;
  card.classList.add('is-visible');

  $('#cardClose').addEventListener('click', deselect);
  $('#cardMessage').addEventListener('click', async () => {
    try {
      const { error } = await supabase.rpc('find_or_create_dm', { other_user: c.id });
      if (error) throw error;
      location.href = 'app.html?v=messages';
    } catch(err){ toast(err.message || 'Could not open chat', 'err'); }
  });
  $('#cardFollow').addEventListener('click', async () => {
    try {
      const { data, error } = await supabase.rpc('toggle_follow', { target: c.id });
      if (error) throw error;
      c.is_following = !!data;
      $('#cardFollow').textContent = c.is_following ? 'Following' : 'Follow';
      toast(c.is_following ? 'Following' : 'Unfollowed');
    } catch(err){ toast(err.message || 'Failed', 'err'); }
  });
}

function hideSelectedCard(){
  $('#selectedCard').classList.remove('is-visible');
  $('#selectedCard').innerHTML = '';
}

/* ─── CONTROLS ────────────────────────────────────────────────────────── */
const slider = $('#radiusSlider');
slider.value = state.radius;
slider.addEventListener('input', e => {
  state.radius = Number(e.target.value);
  $('#radiusLabel').textContent = state.radius + ' km';
  applyFilters();
});

$('#searchInput').addEventListener('input', e => {
  state.query = e.target.value;
  applyFilters();
});

$('#zoomIn').addEventListener('click', () => {
  state.zoom = clamp(state.zoom * 1.35, 1, 3.5);
  renderRadar();
});
$('#zoomOut').addEventListener('click', () => {
  state.zoom = clamp(state.zoom / 1.35, 1, 3.5);
  renderRadar();
});
$('#recenterBtn').addEventListener('click', () => {
  state.zoom = 1;
  state.selectedId = null;
  $('#searchInput').value = '';
  state.query = '';
  slider.value = 60;
  state.radius = 60;
  $('#radiusLabel').textContent = '60 km';
  applyFilters();
  toast('Radar recentered');
});

$('#refreshBtn').addEventListener('click', async () => {
  const btn = $('#refreshBtn');
  btn.disabled = true;
  try {
    await loadCreators();
    toast('Radar refreshed');
  } catch(err){ toast(err.message || 'Refresh failed', 'err'); }
  finally { btn.disabled = false; }
});

/* ─── MOBILE SIDEBAR ──────────────────────────────────────────────────── */
$('#toggleList').addEventListener('click', () => {
  $('#radarSide').classList.toggle('is-open');
});

// Click on empty radar clears selection
$('#radar').addEventListener('click', (e) => {
  if (e.target.closest('.radar-blip')) return;
  if (state.selectedId) deselect();
});

// ESC clears
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.selectedId) deselect();
});
</script>
</body>
</html>
